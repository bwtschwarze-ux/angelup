  {g:4,f:"Was soll ein zwischen Schnur und Vorfach eingefügter Wirbel bewirken?",a:["er soll das Verdrehen der Schnur verhindern","es werden Hänger vermieden","der Fisch kann den Köder besser erkennen"],r:0,e:"Der Wirbel verhindert, dass sich die Schnur durch rotierende Köder verdreht (Drall)."},
  {g:4,f:"Wie soll beim Spinnfischen ein Verdrehen der Angelschnur vermieden werden?",a:["man benutzt starke Schnüre","durch Einschaltung eines Wirbels","man verwendet ein Stahlvorfach"],r:1,e:"Ein Wirbel zwischen Schnur und Köder verhindert das Verdrehen der Schnur."},
  {g:4,f:"Bei welcher Posenart wird ein Stopper verwendet?",a:["bei der Federkielpose","bei der Gleitpose (Laufpose)","bei der Antennenpose"],r:1,e:"Bei der Gleitpose begrenzt ein Stopperknoten die eingestellte Angeltiefe."},
  {g:4,f:"Welchen Zweck erfüllt in erster Linie eine Pose (Floß, Schwimmer)?",a:["sie ermöglicht erst den gezielten Weitwurf des Köders","sie verhindert das Hängenbleiben der Schnur im Kraut","sie hält den Köder in einer bestimmten Wassertiefe und zeigt den Biss an"],r:2,e:"Die Pose hält den Köder auf Tiefe und zeigt durch ihre Bewegung den Biss an."},
  {g:4,f:"Wozu dient eine Löseschere oder Lösezange?",a:["zum Festhalten des Fisches beim Auslösen des Angelhakens","zum Lösen des Hakens vom Stahlvorfach","zum schonenden Herauslösen des Hakens aus dem Maul des Fisches"],r:2,e:"Mit der Lösezange löst man den Haken schnell und schonend aus dem Maul des Fisches."},

  /* ============ 5 · NATUR-, TIER- UND UMWELTSCHUTZ (Fragen 1–56) ============ */
  {g:5,f:"Was ist das Ziel der Naturschutzgesetzgebung?",a:["die Sicherung der Natur als Lebens- und Erholungsraum","sie dient ausschließlich der Landwirtschaft zur Ertragssteigerung","sie dient ausschließlich jagd- und fischereilichen Zwecken"],r:0,e:"Der Naturschutz sichert die Natur als Lebens- und Erholungsraum für Mensch und Tier."},
  {g:5,f:"Welche Ziele beinhaltet die Naturschutzgesetzgebung?",a:["Natur und Landschaft zu schützen und zu pflegen, um die Lebensgrundlage für Mensch und Tier zu erhalten","zum Schutz der Landschaft den Menschen zu hindern, die Natur zu betreten","ausschließlich fischereiliche Ziele zu verwirklichen"],r:0,e:"Ziel ist der Schutz und die Pflege von Natur und Landschaft als Lebensgrundlage."},
  {g:5,f:"Was sind Naturschutzgebiete?",a:["sie haben keine besondere Bedeutung","rechtsverbindlich festgesetzte Gebiete zum Schutz von Natur und Landschaft","sie sind Landschaftsschutzgebieten gleichgesetzt"],r:1,e:"Naturschutzgebiete sind rechtsverbindlich festgesetzte Gebiete mit strengem Schutz."},
  {g:5,f:"Wodurch sollen die Lebensgrundlage des Menschen sowie seine Erholung in Natur und Landschaft nachhaltig gesichert werden?",a:["Naturschutzgesetzgebung","Bürgerliches Recht","Strafrecht"],r:0,e:"Die Naturschutzgesetzgebung sichert Lebensgrundlage und Erholung nachhaltig."},
  {g:5,f:"Was bedeutet für den Angler der § 1 des Bundesnaturschutzgesetzes (Schutz und Erhalt von Tier- und Pflanzenwelt)?",a:["laichreife Fische dürfen nicht gefangen werden","Auftrag, die Fischbestände art- und altersgerecht zu hegen und dem Gewässer anzupassen","Angler sollen befischte Gewässer ständig mit fangfähigen Fischen besetzen"],r:1,e:"Für den Angler folgt daraus der Hegeauftrag: Bestände art- und altersgerecht pflegen."},
  {g:5,f:"Was bedeutet für den Angler Naturschutz?",a:["nur der Schutz und die Erhaltung der Reinheit von Gewässern","die Sicherung ausreichender Besatzmaßnahmen","der Schutz der Lebensgemeinschaften von Pflanzen und Tieren im und am Wasser und ihre Hege"],r:2,e:"Naturschutz heißt Schutz und Hege der gesamten Lebensgemeinschaft im und am Wasser."},
  {g:5,f:"Welche grundsätzliche Aussage enthält das Bundesnaturschutzgesetz bezüglich Wasserflächen?",a:["Wasserflächen sind zu erhalten, zu vermehren und vor Verunreinigungen zu schützen, um ihre natürliche Selbstreinigungskraft zu bewahren","ausschließlich Wasserflächen in Moorbereichen sind zu schützen","welche Fischarten in den einzelnen Gewässertypen einzusetzen sind"],r:0,e:"Wasserflächen sind zu erhalten, zu vermehren und vor Verunreinigung zu schützen."},
  {g:5,f:"Welchen Einfluss können nicht heimische Tierarten auf unsere Natur ausüben?",a:["sie können das biologische Gleichgewicht stören","sie können für die heimische Natur eine Bereicherung darstellen","sie haben keinen Einfluss auf die heimische Natur"],r:0,e:"Nicht heimische Arten können das biologische Gleichgewicht empfindlich stören."},
  {g:5,f:"Was ist ein Biotop?",a:["ein Lebensraum, der nur Fischen dient","der Lebensraum einer bestimmten Pflanzen- und Tiergesellschaft oder einer einzelnen Art","verschiedene Arten von Gewässertypen"],r:1,e:"Ein Biotop ist der Lebensraum einer bestimmten Lebensgemeinschaft von Pflanzen und Tieren."},
  {g:5,f:"Wie soll sich ein Angler im Uferbereich von Gewässern verhalten?",a:["er darf seinen Angelplatz so herrichten, dass er gut fischen kann","keine Pflanzen im Wasser und Uferbereich beschädigen oder beseitigen","es gibt keine Verhaltensregeln"],r:1,e:"Uferpflanzen dürfen nicht beschädigt werden – sie sind Lebens- und Laichraum."},
  {g:5,f:"Was soll der Angler stets beachten?",a:["er soll im Rahmen seiner Möglichkeiten am Gewässer Naturschutz praktizieren","dass Gewässer ständig mit fangreifen Fischen nachbesetzt werden","er muss durch Besatz nicht einheimischer Fische eine große Artenvielfalt erzielen"],r:0,e:"Der Angler soll immer aktiven Naturschutz am Gewässer betreiben."},
  {g:5,f:"Warum werden Landschaftsschutzgebiete eingerichtet?",a:["zur Erhaltung des Naturhaushaltes und der Nutzbarkeit seiner Naturgüter zur Erholung der Menschen","um Anglern und Jägern ihr Hobby zu sichern","um diese Gebiete von jeglichen Einflüssen der Umwelt abzuschirmen"],r:0,e:"Landschaftsschutzgebiete erhalten den Naturhaushalt und die Erholungsfunktion der Landschaft."},
  {g:5,f:"Sind heimische Teich- und Seerosen besonders geschützt?",a:["es gibt keine besonderen Vorschriften, die ihren Schutz regeln","ja, denn sie stehen unter Naturschutz, weil selten geworden und sogar vom Aussterben bedroht","nein, denn sie sind aus Sicht der Fischerei wenig nützlich"],r:1,e:"Heimische Teich- und Seerosen stehen unter Naturschutz und dürfen nicht entnommen werden."},
  {g:5,f:"Wie verhalte ich mich, wenn ich an einem Gewässer Unken, Frösche oder Kröten entdecke?",a:["sie stehen unter Naturschutz und dürfen nicht verjagt, gefangen oder getötet werden","verjagen, da sie die Fische beunruhigen","fangen, um sie für Beobachtungszwecke in einem Terrarium zu halten"],r:0,e:"Alle heimischen Amphibien stehen unter Naturschutz – nicht stören, fangen oder töten."},
  {g:5,f:"Was ist zu beachten, wenn zu starke Wasserpflanzenbestände gelichtet werden sollen?",a:["gute Angelplätze sollen geschaffen werden","Arbeiten nicht während der Laichzeit durchführen und geschützte Pflanzen nicht beseitigen","der Untergrund des Gewässers darf nicht zu stark aufgewühlt werden"],r:1,e:"Pflegearbeiten nicht in der Laichzeit und geschützte Pflanzen dabei schonen."},
  {g:5,f:"Welche Frösche, Unken, Salamander und Molche stehen unter Naturschutz?",a:["nur Kröten und Molche","alle","mit Ausnahme des Wasserfrosches, alle"],r:1,e:"Alle heimischen Lurche (Amphibien) stehen unter Naturschutz."},
  {g:5,f:"Was versteht das Naturschutzgesetz unter Artenschutz?",a:["Schutz und Pflege wildlebender Tiere und Pflanzen einschließlich ihrer Entwicklungsstadien, Lebensräume und Lebensgemeinschaften","Erhöhung des Fischbesatzes","Vertreibung von Wasservögeln"],r:0,e:"Artenschutz umfasst Tiere, Pflanzen, ihre Entwicklungsstadien und Lebensräume."},
  {g:5,f:"Welche Auskunft geben „Rote Listen“ im Naturschutz?",a:["sie dienen ausschließlich der Bestandsregulierung von Fischbeständen","sie geben Auskunft über den Gefährdungsgrad einzelner Tier- und Pflanzenarten","sie gelten nur für stehende Gewässer"],r:1,e:"Rote Listen zeigen, wie stark einzelne Arten in ihrem Bestand gefährdet sind."},
  {g:5,f:"Darf der Angler Libellenlarven als Köder benutzen?",a:["ja","nein, sie stehen unter besonderem Schutz","nur wenn sie vorher betäubt werden"],r:1,e:"Libellen und ihre Larven stehen unter Schutz und dürfen nicht als Köder verwendet werden."},
  {g:5,f:"Was besagt u. a. der § 1 des Tierschutzgesetzes?",a:["für den Angler hat der § 1 keine Aussagekraft, da er nur Landtiere betrifft","niemand darf einem Tier ohne vernünftigen Grund Schmerzen, Leiden oder Schäden zufügen oder es töten","er regelt das Töten gefangener Fische"],r:1,e:"Kernsatz des Tierschutzgesetzes: keinem Tier ohne vernünftigen Grund Schmerzen, Leiden oder Schäden zufügen."},
  {g:5,f:"Welche Handlungen verstoßen gegen das Tierschutzgesetz?",a:["die Errichtung von Fischtreppen","das Zurücksetzen maßiger Fische, unsachgemäßer Transport, unsachgemäße Tötung","die Elektrofischerei zur Bestandsregulierung"],r:1,e:"Unsachgemäßer Umgang (falscher Transport, unsachgemäße Tötung) verstößt gegen das Tierschutzgesetz."},
  {g:5,f:"Wann verstößt der Angler gegen das Tierschutzgesetz?",a:["er verwendet einen lebendigen Köderfisch","er nimmt an einem Hegefischen zur Bestandsregulierung teil","bei der Elektrofischerei, die zur Arterhaltung dient"],r:0,e:"Die Verwendung lebender Köderfische ist verboten und verstößt gegen das Tierschutzgesetz."},
  {g:5,f:"Was sind vernünftige Gründe für das Angeln?",a:["Angeln um Preise und Pokale","Verwertung des Fanges durch Mensch und Tier oder Bestandsregulierung","ausschließlich die Freude beim Drill großer Fische"],r:1,e:"Vernünftiger Grund ist die Verwertung des Fanges oder die Hege/Bestandsregulierung – nicht der Sport allein."},
  {g:5,f:"Warum sind Mindestmaße für Fische unbedingt erforderlich?",a:["um dem Fisch wenigstens einmal die Möglichkeit zum Laichen zu geben, damit die Art erhalten wird","um dem Angler möglichst kapitale Fische zu sichern","Mindestmaße sind nicht erforderlich"],r:0,e:"Das Mindestmaß stellt sicher, dass der Fisch mindestens einmal ablaichen konnte."},
  {g:5,f:"Wie ist der untermaßige Fisch nach dem Fang zu behandeln?",a:["vorsichtig mit nassen Händen anfassen, Haken entfernen und schonend zurücksetzen","ihn sofort töten, um ihm Stress zu ersparen","mit trockenen Händen anfassen, damit er nicht aus den Händen rutscht"],r:0,e:"Mit nassen Händen anfassen (Schleimhaut schützen) und schonend zurücksetzen."},
  {g:5,f:"Was versteht man unter dem Begriff waidgerechtes Fischen?",a:["die Verwendung lebender Köderfische","die Einstellung zur Kreatur Fisch unter Berücksichtigung des Tier- und Fischartenschutzes","das Reißen von Fischen"],r:1,e:"Waidgerecht heißt verantwortungsvoller, tierschutz- und artenschutzgerechter Umgang mit dem Fisch."},
  {g:5,f:"Wodurch kann beim Fisch Stress hervorgerufen werden?",a:["ausschließlich durch den Fang","Beunruhigung, Sauerstoffmangel, unsachgemäße Hälterung und Ähnliches","ausschließlich durch die Hälterung"],r:1,e:"Stress entsteht durch Beunruhigung, Sauerstoffmangel und unsachgemäße Hälterung."},
  {g:5,f:"Können Fische Schmerzen empfinden?",a:["nein, Fische sind schmerzunempfindlich","diese Frage ist nicht endgültig geklärt","ja, Fische können jedoch nur Schmerzen empfinden, wenn sie von außen gehakt werden"],r:1,e:"Nach dem Katalog gilt diese Frage als nicht endgültig geklärt – der Angler geht dennoch immer schonend vor."},
  {g:5,f:"Darf man mit lebendem Köderfisch angeln?",a:["ja, mit Erlaubnis des Vereinsvorstandes","nein","ja, aber nur mit Raubfischen"],r:1,e:"Das Angeln mit lebendem Köderfisch ist verboten (Tierschutz)."},
  {g:5,f:"Was ist ein Fischschonbezirk?",a:["ein Gewässerabschnitt, in dem das Angeln für bestimmte Zeitabschnitte oder ganzjährig verboten ist","ein Teich, der der Aufzucht von Fischbesatz dient","eine Gewässerstrecke, die nur mit der Fliegenrute befischt werden darf"],r:0,e:"Ein Fischschonbezirk ist zeitweise oder ganzjährig für den Fischfang gesperrt."},
  {g:5,f:"Welche Bedeutung haben Schonzeiten?",a:["sie sollen ein ungestörtes Ablaichen ermöglichen und legen fest, dass bestimmte Fischarten während dieser Zeit nicht gefangen werden dürfen","während dieser Zeit müssen gefangene Fische besonders schonend behandelt werden","während dieser Schonzeit dürfen nur Raubfische gefangen werden"],r:0,e:"Schonzeiten schützen die Arten während der Laichzeit vor dem Fang."},
  {g:5,f:"Was sind Artenschonzeiten?",a:["Zeiträume, in denen bestimmte Fischarten nicht gefangen werden dürfen","Zeiträume, in denen Milchner nicht gefangen werden dürfen","Zeiträume, die für Salmonidenbesatz festgelegt sind"],r:0,e:"In der Artenschonzeit darf die jeweilige Fischart nicht gefangen werden."},
  {g:5,f:"Welche Fischart gilt als unmittelbar vom Aussterben bedrohte Art?",a:["Zander","Europäischer Stör","Bachforelle"],r:1,e:"Der Europäische Stör gilt als unmittelbar vom Aussterben bedroht."},
  {g:5,f:"Welche Säugetiere, die im oder am Wasser leben, sind nach der Bundesartenschutzverordnung besonders geschützt?",a:["Biber, Fischotter","Bisam, Waschbär","Wasserratte (Schermaus), Wanderratte"],r:0,e:"Biber und Fischotter sind besonders geschützt; Bisam und Waschbär sind nicht heimisch und nicht geschützt."},
  {g:5,f:"Weshalb sollen bei Besatzmaßnahmen bestandsbedrohte Fischarten eingesetzt werden, wenn sie für dieses Gewässer geeignet sind?",a:["bestandsbedrohte Fische sollten nicht eingesetzt werden, da ihre Überlebenschancen gering sind","der Bestand bedrohter Fische soll erhalten und vermehrt werden","es sind gute Köderfische für das Raubfischangeln"],r:1,e:"Besatz mit bedrohten, standortgerechten Arten hilft, deren Bestand zu erhalten und zu vermehren."},
  {g:5,f:"Wann ist Besatz erforderlich?",a:["es findet keine natürliche Fortpflanzung statt","immer","die Angler sind wiederholt ohne Fang geblieben"],r:0,e:"Besatz ist nötig, wenn sich eine Art im Gewässer nicht ausreichend natürlich fortpflanzt."},
  {g:5,f:"Können durch Angler Fischkrankheiten in offene Gewässer eingeschleppt werden?",a:["nein","ja","Fischkrankheiten kommen nur in Teichwirtschaften vor"],r:1,e:"Über Gerät, Kescher und Besatzfische können Krankheiten verschleppt werden – daher Hygiene und Gesundheitszeugnisse."},
  {g:5,f:"Welche Bedeutung haben amtliche Gesundheitsbescheinigungen für Satzfische?",a:["Gewähr für schnelles Wachstum","Gewähr für gesunde Fische","Gewähr für Reinrassigkeit"],r:1,e:"Die Bescheinigung soll sicherstellen, dass nur gesunde Fische besetzt werden."},
  {g:5,f:"Wie muss sich der Angler verhalten, wenn er in Ufernähe einen brütenden Vogel feststellt?",a:["er ist grundsätzlich nicht gehalten, die Brutsituation zu berücksichtigen","entsprechend weiten Abstand zum brütenden Vogel einnehmen, um das Brutgeschäft nicht zu stören","nachsehen, ob die Jungvögel schon geschlüpft sind"],r:1,e:"Ausreichend Abstand halten, um das Brutgeschäft nicht zu stören."},
  {g:5,f:"Warum sind Fangstatistiken wichtig?",a:["sie geben Auskunft über Fischarten, Bestandsdichte und Abwuchs der Fische","es soll den Vereinsmitgliedern bewiesen werden, wie leistungsfähig der einzelne Angler ist","sie dienen dazu, Vereinsmitglieder zu kontrollieren"],r:0,e:"Fangstatistiken liefern wichtige Daten über Artenzusammensetzung, Bestand und Wachstum – Grundlage der Hege."},
  {g:5,f:"Warum fordern Angler die Durchgängigkeit von Fließgewässern?",a:["dadurch kann sich der Biber besser verbreiten","viele Fischarten können nur dadurch ihre Laichgebiete erreichen","das wird von vielen Wassersportlern gewünscht"],r:1,e:"Nur durchgängige Fließgewässer erlauben Wanderfischen, ihre Laichgebiete zu erreichen."},
  {g:5,f:"Welche Fische gehören nicht in die Forellenregion?",a:["Bachneunaugen, Elritze","Kaulbarsch, Aal","Mühlkoppe, Bachforelle"],r:1,e:"Kaulbarsch und Aal sind keine typischen Fische der kühlen, sauerstoffreichen Forellenregion."},
  {g:5,f:"Sind laut Bundesartenschutzverordnung alle Lurche (Amphibien) und Kriechtiere (Reptilien) besonders geschützt?",a:["ja","ja, mit Ausnahme der Ringelnatter, alle","Kriechtiere (Reptilien) sind nicht geschützt"],r:0,e:"Alle heimischen Amphibien und Reptilien sind nach der Bundesartenschutzverordnung besonders geschützt."},
  {g:5,f:"Welche Ziele haben sich die Deutschen Fischereivereine gesetzt?",a:["Gewässer- und Artenschutz","an den Wettangelveranstaltungen dürfen nur Vereinsmitglieder teilnehmen","die Mindestmaße bei Raubfischen abzuschaffen"],r:0,e:"Oberstes Ziel der Fischereivereine ist der Gewässer- und Artenschutz (Hege)."},
  {g:5,f:"Was sind die Hauptursachen für Gewässerbelastungen?",a:["Beschattung durch Bäume","Einleitung von Abwässern und naturferner Gewässerausbau","Schilfanpflanzungen"],r:1,e:"Abwassereinleitungen und der naturferne Ausbau belasten Gewässer am stärksten."},
  {g:5,f:"Was wird unter der Renaturierung eines Fließgewässers verstanden?",a:["die Verbauung und Regulierung des Fließgewässers","die Wiederherstellung eines möglichst naturnahen Zustandes","das Fließgewässer wird unter Naturschutz gestellt"],r:1,e:"Renaturierung bedeutet, ein Gewässer wieder in einen naturnahen Zustand zu versetzen."},
  {g:5,f:"Welche Ursache kann zu einem Fischsterben führen?",a:["Einleitung von ungeklärten Abwässern","der Laichausschlag bei bestimmten Fischarten","Elektrofischen"],r:0,e:"Ungeklärte Abwässer entziehen Sauerstoff bzw. vergiften das Wasser – häufige Ursache für Fischsterben."},
  {g:5,f:"Wer hat Beobachtungen über krankheitsverdächtige Fische zu melden?",a:["nur die Polizei","jeder Fischereiausübungsberechtigte","nur der Amtstierarzt"],r:1,e:"Jeder Fischereiausübungsberechtigte ist zur Meldung krankheitsverdächtiger Fische verpflichtet."},
  {g:5,f:"Gewässergüteklassen geben Auskunft über …",a:["die Belastung eines Gewässers durch Schwermetalle","die Einteilung eines Gewässers in Abschnitte nach vorkommenden Fischarten","die chemische und biologische Beschaffenheit eines Gewässers"],r:2,e:"Die Gewässergüteklasse beschreibt die chemische und biologische Beschaffenheit (Belastungsgrad)."},
  {g:5,f:"Welche Vogelarten ernähren sich hauptsächlich von Fischen?",a:["Stockente und Blässhuhn","Kormoran, Eisvogel und Haubentaucher","Kranich und Weißstorch"],r:1,e:"Kormoran, Eisvogel und Haubentaucher sind ausgesprochene Fischfresser."},
  {g:5,f:"Was ist die Hauptursache für das Verschwinden vieler Fischnährtiere?",a:["Gewässerrenaturierungen","Insektizide, Gewässerverschmutzung, Wasserbaumaßnahmen, Sedimenteintrag","die starke Vermehrung ihrer natürlichen Feinde und Besatzmaßnahmen"],r:1,e:"Verschmutzung, Gifte und Verbauung vernichten die Kleinlebewesen, von denen die Fische leben."},
  {g:5,f:"Was ist in Laichschongebieten verboten?",a:["jeder Fischfang und auch jede Beunruhigung der Fische während der Laichzeit","das Angeln mit lebenden Ködern","nur das Fischen mit Netzen"],r:0,e:"Im Laichschongebiet sind während der Laichzeit Fischfang und jede Beunruhigung verboten."},
  {g:5,f:"Warum sollten in der Regel in Gewässer nur Jungfische eingesetzt werden?",a:["dies ergibt die Möglichkeit, dass untermaßige Fische mehrfach gefangen werden können","die natürliche Produktionskraft der Gewässer ist so besser zu nutzen","so besteht die Möglichkeit, beim Angeln mehr Fische zu fangen"],r:1,e:"Jungfische wachsen im Gewässer heran und nutzen dessen natürliche Produktionskraft besser aus."},
  {g:5,f:"Wie soll ein Fischbestand in einem Gewässer aussehen und erhalten werden?",a:["mit möglichst großen Raubfischen","dem Gewässer entsprechend artenreich und in richtiger Alterszusammensetzung","mit möglichst großen Friedfischen"],r:1,e:"Ein gesunder Bestand ist artenreich und altersgemischt, passend zum Gewässertyp."},
  {g:5,f:"Warum sollen in Salmonidengewässern grundsätzlich Grundräumungen unterbleiben?",a:["dadurch wird das Kanufahren erschwert","durch Grundräumungen werden die Kiesbetten als Laichstätten zerstört","durch Grundräumungen werden Kormorane angelockt"],r:1,e:"Grundräumungen zerstören die Kieslaichplätze der Salmoniden."},
  {g:5,f:"Welche Auswirkungen hat der Bisam auf Gewässer?",a:["Bisame fressen Fische und können den Bestand gefährden","sie fressen Pflanzen und Muscheln und unterwühlen die Ufer","Bisame sind Fleischfresser und können Fischkrankheiten übertragen"],r:1,e:"Der Bisam frisst Pflanzen und Muscheln und untergräbt durch seine Baue die Ufer."},

  /* ============ 6 · FISCHEREIRECHT (Fragen 6–60) ============ */
  {g:6,f:"Wer stellt einen Fischereierlaubnisschein aus?",a:["das Ordnungsamt der Gemeinde oder Stadt","die Fischereibehörde des Landkreises","der Fischereiberechtigte, z. B. der Fischereiverein"],r:2,e:"Den Erlaubnisschein für ein bestimmtes Gewässer stellt der Fischereiberechtigte (meist der Verein/Pächter) aus."},
  {g:6,f:"Wer ist berechtigt, in Niedersachsen die nach dem Fischereigesetz vorgeschriebene Fischerprüfung abzunehmen?",a:["die beiden anerkannten Landesfischereiverbände","die untere Fischereibehörde","die anerkannten Sportfischervereine"],r:0,e:"Die Fischerprüfung nehmen in Niedersachsen die beiden anerkannten Landesfischereiverbände ab."},
  {g:6,f:"Durch welches Gesetz bzw. welche Verordnung ist das Töten von Fischen geregelt?",a:["durch das Tierschutzgesetz bzw. die Tierschutz-Schlachtverordnung","durch das Niedersächsische Fischereigesetz","durch das Naturschutzgesetz"],r:0,e:"Das Töten von Fischen regeln das Tierschutzgesetz und die Tierschutz-Schlachtverordnung."},
  {g:6,f:"Welche Ausweise hat ein Angler in Niedersachsen bei Ausübung der Fischerei mit sich zu führen?",a:["den Fischereierlaubnisschein in Verbindung mit dem Personalausweis oder Fischereischein","den Personalausweis mit Lichtbild","das polizeiliche Führungszeugnis"],r:0,e:"Mitzuführen sind Fischereierlaubnisschein und Fischereischein (bzw. Personalausweis zur Identität)."},
  {g:6,f:"Wer stellt in Niedersachsen den Fischereischein aus?",a:["der Landkreis","das Ordnungsamt der Gemeinde oder der Stadt","der Landesfischereiverband"],r:1,e:"Den Fischereischein stellt das Ordnungsamt der Gemeinde oder Stadt aus."},
  {g:6,f:"Was benötigt man zum Erhalt eines Fischereischeins?",a:["Bescheinigung der Naturschutzbehörde","den Fischereischein erhält jeder","einen Fischerprüfungsausweis"],r:2,e:"Voraussetzung für den Fischereischein ist der Nachweis der bestandenen Fischerprüfung (Prüfungsausweis)."},

function machePerms(reihe){
  const perms={}; reihe.forEach(idx=>perms[idx]=mische([0,1,2])); return perms;
}
function startLernen(gid){
  stopSprich();
  const idxs=FRAGEN.map((f,i)=>({f,i})).filter(o=>o.f.g===gid).map(o=>o.i);
  const reihe=mische(idxs);
  state.lernSitzung={titel:GEBIETE.find(g=>g.id===gid).name, farbe:GEBIETE.find(g=>g.id===gid).farbe,
    icon:GEBIETE.find(g=>g.id===gid).icon, reihe, perms:machePerms(reihe), pos:0, gewaehlt:null, aufgedeckt:false, richtige:0, hilfeAn:false};
  state.view='lernsitzung'; render(); autoVorlesen();
}
function startFehlerkiste(){
  stopSprich();
  const idxs=mische([...state.fehlerkiste]);
  if(!idxs.length) return;
  state.lernSitzung={titel:"Fehlerkiste", farbe:"var(--rot)", icon:"🧰",
    reihe:idxs, perms:machePerms(idxs), pos:0, gewaehlt:null, aufgedeckt:false, richtige:0, hilfeAn:false};
  state.view='lernsitzung'; render(); autoVorlesen();
}
function autoVorlesen(){
  if(state.vorlesen && state.lernSitzung){

    frageVorlesen(FRAGEN[idx], aktivePerm(idx));
  }
}

function vorlesenKlick(idx){ frageVorlesen(FRAGEN[idx], aktivePerm(idx)); }
function vorlesenToggle(an){ state.vorlesen=an; if(an) autoVorlesen(); else stopSprich(); }
function lernWaehle(i){ if(state.lernSitzung.aufgedeckt) return; state.lernSitzung.gewaehlt=i; render(); }
function lernHilfeToggle(){ const s=state.lernSitzung; s.hilfeAn=!s.hilfeAn; render(); }
function lernPruefen(){
  const s=state.lernSitzung; if(s.gewaehlt===null) return;
  s.aufgedeckt=true;
  const idx=s.reihe[s.pos]; const fr=FRAGEN[idx];
  const richtig=s.gewaehlt===fr.r;
  const alt=state.gelernt[idx]||{versuche:0,fehlversuche:0,richtig:false};
  state.gelernt[idx]={richtig, versuche:alt.versuche+1, fehlversuche:alt.fehlversuche+(richtig?0:1)};
  if(richtig){
    s.richtige++; state.xp+=10; state.streak++;
    state.besteStreak=Math.max(state.besteStreak,state.streak);
    state.fehlerkiste.delete(idx);
  } else {
    state.xp+=2; state.streak=0; state.fehlerkiste.add(idx);
  }
  speichereFortschritt(idx);
  if(state.vorlesen){
    const e=richtig?"Richtig! ":"Leider falsch. Die richtige Antwort ist: "+fr.a[fr.r]+". ";
    sprich(e+fr.e);
  }
  render();
}
function lernWeiter(){
  const s=state.lernSitzung;
  stopSprich();
  if(s.pos+1<s.reihe.length){ s.pos++; s.gewaehlt=null; s.aufgedeckt=false; s.hilfeAn=false; render(); autoVorlesen(); }
  else { state.view='dashboard'; state.lernSitzung=null; render(); }
}

/* =========================== PRÜFUNG =========================== */
function startPruefung(){
  stopSprich();
  const r=regeln();
  let auswahl=[];
  GEBIETE.forEach(g=>{
    const idxs=FRAGEN.map((f,i)=>({f,i})).filter(o=>o.f.g===g.id).map(o=>o.i);
    auswahl=auswahl.concat(mische(idxs).slice(0,r.fragenProGebiet));
  });
  const reihe=mische(auswahl);
  state.pruefung={reihe, perms:machePerms(reihe), antworten:{}, pos:0, restSek:r.zeitMinuten*60, abgegeben:false, zeitAus:false};
  state.view='pruefung'; render(); startTimer();
}
function startTimer(){
  stopTimer();
  state.timerId=setInterval(()=>{
    const p=state.pruefung; if(!p||p.abgegeben) return stopTimer();
    p.restSek--;
    const el=$('#timer');
    if(el){ el.textContent=formatZeit(p.restSek); if(p.restSek<=300) el.parentElement.classList.add('knapp'); }
    if(p.restSek<=0){ stopTimer(); pruefungAbgeben(true); }
  },1000);
}
function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }
function formatZeit(s){ const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }
/* Bestehensgrenze eines laufenden/abgegebenen Prüfungssatzes – skaliert auf die tatsächliche Fragenzahl */
function schwellen(reihe){
  const r=regeln();
  const proGebiet={};
  reihe.forEach(i=>proGebiet[FRAGEN[i].g]=(proGebiet[FRAGEN[i].g]||0)+1);
  const gebietSchwelle={};
  Object.keys(proGebiet).forEach(gid=>{
    gebietSchwelle[gid]=Math.round(r.bestehenProGebiet/r.fragenProGebiet*proGebiet[gid]);
  });
  const werte=Object.values(gebietSchwelle);
  return {
    gesamt: Math.round(r.bestehenGesamt/r.fragenGesamt*reihe.length),
    proGebiet: gebietSchwelle,
    // nur sinnvoll anzuzeigen, wenn der Satz mehrere Sachgebiete umfasst und die Grenze überall gleich ist
    jeGebietEinheitlich: werte.length>1 && werte.every(v=>v===werte[0]) ? werte[0] : null
  };
}

function viewPruefung(){
  const p=state.pruefung; const idx=p.reihe[p.pos]; const fr=FRAGEN[idx];
  const g=GEBIETE.find(x=>x.id===fr.g);
  const gewaehlt=p.antworten[idx];
  const beantwortet=Object.keys(p.antworten).length;
  const pct=Math.round(beantwortet/p.reihe.length*100);
  const sw=schwellen(p.reihe);
  const perm=p.perms[idx];
  const antwortenHtml=perm.map((orig,i)=>`<button class="antwort${gewaehlt===orig?' gewaehlt':''}" onclick="pruefWaehle(${idx},${orig})">
    <span class="buchstabe">${['A','B','C'][i]}</span><span>${fr.a[orig]}</span></button>`).join('');
  return `
  <div class="quizbox">
    <div class="quiz-kopf">
      <span class="badge">${g.icon} ${g.kurz}</span>
      <span class="badge">Frage ${p.pos+1} / ${p.reihe.length}</span>
      <span class="badge timer">⏱ <span id="timer">${formatZeit(p.restSek)}</span></span>
    </div>
    <div class="progressbalken"><span style="width:${pct}%"></span></div>
    <div class="bestehen-leiste">🎯 Bestehensgrenze: <b>${sw.gesamt} von ${p.reihe.length}</b> richtig${sw.jeGebietEinheitlich?` · und mind. <b>${sw.jeGebietEinheitlich}</b> je Sachgebiet`:''}</div>
    <div class="frage-zeile">
      <div class="frage">${fr.f}</div>
      <button class="sprecher" title="Frage vorlesen" onclick="vorlesenKlick(${idx})">🔊</button>
    </div>
    ${bildHTML(fr)}
    ${antwortenHtml}
    <div class="quiz-fuss">
      <button class="btn ghost" onclick="pruefBlaettern(-1)" ${p.pos===0?'disabled':''}>← Zurück</button>
      ${p.pos+1<p.reihe.length
        ? `<button class="btn" onclick="pruefBlaettern(1)">Weiter →</button>`
        : `<button class="btn gruen" onclick="pruefungAbgeben(false)">Prüfung abgeben ✓</button>`}
    </div>
    <div style="text-align:center;margin-top:14px;font-size:.82rem;color:var(--grau)">
      ${beantwortet} von ${p.reihe.length} beantwortet
      ${beantwortet===p.reihe.length&&p.pos+1<p.reihe.length?` · <button class="zurueck" style="display:inline;margin:0" onclick="pruefungAbgeben(false)">jetzt abgeben</button>`:''}
    </div>
  </div>`;
}
function pruefWaehle(idx,i){ state.pruefung.antworten[idx]=i; render(); }
function pruefBlaettern(d){ const p=state.pruefung; p.pos=Math.max(0,Math.min(p.reihe.length-1,p.pos+d)); render(); }
function pruefungAbgeben(zeitAus){
  const p=state.pruefung; p.abgegeben=true; p.zeitAus=zeitAus; stopTimer(); stopSprich();
  let richtigGesamt=0; const proGebiet={};
  GEBIETE.forEach(g=>proGebiet[g.id]={richtig:0,gesamt:0});
  p.reihe.forEach(idx=>{
    const fr=FRAGEN[idx]; proGebiet[fr.g].gesamt++;
    const ok=p.antworten[idx]===fr.r;
    if(ok){ richtigGesamt++; proGebiet[fr.g].richtig++; }
    else state.fehlerkiste.add(idx);
    const alt=state.gelernt[idx]||{versuche:0,fehlversuche:0,richtig:false};
    state.gelernt[idx]={richtig:ok, versuche:alt.versuche+1, fehlversuche:alt.fehlversuche+(ok?0:1)};
  });
  p.ergebnis={richtigGesamt, proGebiet};
  state.simsGesamt++;
  const sw=schwellen(p.reihe);
  let alleOk=true;
  GEBIETE.forEach(g=>{
    const pg=p.ergebnis.proGebiet[g.id];
    if(pg.gesamt>0 && pg.richtig<(sw.proGebiet[g.id]||0)) alleOk=false;
  });
  p.bestanden = richtigGesamt>=sw.gesamt && alleOk;
  if(p.bestanden){ state.simsBestanden++; state.xp+=50; }
  else state.xp+=15;
  // Cloud: Simulation + kompletten Fragen-Fortschritt speichern
  speichereSimulation(p);
  if(state.user){
    const rows=p.reihe.map(idx=>{ const e=state.gelernt[idx]; const fr=FRAGEN[idx];
      return {user_id:state.user.id, frage_idx:idx, gebiet:fr.g, richtig:e.richtig, versuche:e.versuche, fehlversuche:e.fehlversuche, updated_at:new Date().toISOString()}; });
    sb.from('fortschritt').upsert(rows).then(()=>{});
  }
  state.view='ergebnis'; render();
  if(p.bestanden) konfetti();
}

    ${p.bestanden?' Stark – weiter so! +50 XP':' Kopf hoch: Deine Fehler warten in der Fehlerkiste mit Erklärungen auf dich. +15 XP'}</p>

    const deine=p.antworten[idx];

/* =========================== AUSBILDER (echte Kursdaten) =========================== */
async function ladeKursDaten(){
  if(!state.user) return;
  const {data:kurse}=await sb.from('kurse').select('*').eq('ausbilder_id',state.user.id);
  const kurs=(kurse&&kurse[0])||null;
  const code=kurs?kurs.code:null;
  let mitglieder=[];
  if(code){
    const {data:profs}=await sb.from('profiles').select('*').eq('kurs_code',code).neq('id',state.user.id);
    const ids=(profs||[]).map(p=>p.id);
    let fs=[], sims=[];
    if(ids.length){
      const r1=await sb.from('fortschritt').select('*').in('user_id',ids); fs=r1.data||[];
      const r2=await sb.from('simulationen').select('user_id,bestanden').in('user_id',ids); sims=r2.data||[];
    }
    mitglieder=(profs||[]).map(p=>{
      const meine=fs.filter(f=>f.user_id===p.id);
      const gebiete={};
      GEBIETE.forEach(g=>{
        const gf=meine.filter(f=>f.gebiet===g.id);
        const fragenImGebiet=FRAGEN.filter(fr=>fr.g===g.id).length||1;
        gebiete[g.id]=Math.round(gf.filter(f=>f.richtig).length/fragenImGebiet*100);
      });
      return {id:p.id, name:p.name||'(ohne Namen)', gebiete,
        lernzeitMin:Math.round((p.lernzeit_sek||0)/60), sollMin:p.soll_min||600,
        sim:sims.filter(s=>s.user_id===p.id).length,
        bestanden:sims.filter(s=>s.user_id===p.id&&s.bestanden).length,
        fortschritt:meine};
    });
  }
  // Meist-verfehlte Fragen im Kurs
  const fehlerMap={};
  mitglieder.forEach(m=>m.fortschritt.forEach(f=>{ if(f.fehlversuche>0) fehlerMap[f.frage_idx]=(fehlerMap[f.frage_idx]||0)+f.fehlversuche; }));
  const topFehler=Object.entries(fehlerMap).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([idx,anz])=>({idx:+idx, anz}));
  state.kursDaten={code, kursName:kurs?kurs.name:'', mitglieder, topFehler};
  render();
}
function kursSchnitt(gid){
  const m=state.kursDaten.mitglieder;
  if(!m.length) return 0;
  return Math.round(m.reduce((a,p)=>a+p.gebiete[gid],0)/m.length);
}
function heatFarbe(v){ return v>=75?'var(--gruen)':v>=50?'var(--akzent)':'var(--rot)'; }
function viewAusbilder(){
  if(!state.kursDaten){ ladeKursDaten();
    return `<h1>Ausbilder-Cockpit 👨‍🏫</h1><p class="lead">Lade Kursdaten…</p>`; }
  const kd=state.kursDaten;
  const zeilen=kd.mitglieder.map((p,i)=>{
    const schnitt=Math.round(Object.values(p.gebiete).reduce((a,b)=>a+b,0)/6);
    const zeitPct=Math.min(100,Math.round(p.lernzeitMin/(p.sollMin||1)*100));
    return `<tr class="klick" onclick="zeigeSchueler(${i})">
      <td><strong>${p.name}</strong></td>
      <td><span class="mini-balken"><span style="width:${schnitt}%;background:${heatFarbe(schnitt)}"></span></span>${schnitt}%</td>
      <td><span class="mini-balken"><span style="width:${zeitPct}%;background:${heatFarbe(zeitPct)}"></span></span>${lernzeitFormat(p.lernzeitMin*60)} / ${lernzeitFormat(p.sollMin*60)}</td>
      <td>${p.sim}× (${p.bestanden} bestanden)</td></tr>`;
  }).join('');
  const heat=GEBIETE.map(g=>{ const v=kursSchnitt(g.id);
    return `<div class="zelle" style="background:${heatFarbe(v)}">${v}%<small>${g.kurz}</small></div>`; }).join('');
  const schwaechstes=GEBIETE.reduce((min,g)=>kursSchnitt(g.id)<kursSchnitt(min.id)?g:min,GEBIETE[0]);
  const topFehler=kd.topFehler.length? kd.topFehler.map(t=>{
    const fr=FRAGEN[t.idx]; const g=GEBIETE.find(x=>x.id===fr.g);
    return `<div class="fehlerfrage"><span>${g.icon} ${fr.f}</span><b>${t.anz}× falsch</b></div>`; }).join('')
    : `<p style="font-size:.88rem;color:var(--grau);margin:0">Noch keine Fehler-Daten – sobald deine Prüflinge üben, siehst du hier, wo es hakt.</p>`;
  return `
  <h1>Ausbilder-Cockpit 👨‍🏫</h1>
  <p class="lead">${kd.mitglieder.length?`${kd.mitglieder.length} Prüfling${kd.mitglieder.length===1?'':'e'} in deinem Kurs.`:'Noch keine Prüflinge – teile deinen Kurs-Code!'}</p>

  <div class="karte" style="margin-bottom:18px;border-left:6px solid var(--welle)">
    <h3 style="margin:0 0 4px">🔑 Dein Kurs-Code</h3>
    <p style="margin:0 0 10px;font-size:.87rem;color:var(--grau)">Prüflinge geben diesen Code bei der Registrierung ein und erscheinen dann automatisch hier:</p>
    <span class="code-box">${kd.code||'–'}</span>
  </div>

  ${kd.mitglieder.length?`
  <div class="karte" style="border-left:6px solid var(--rot);margin-bottom:18px">
    <h3 style="margin:0 0 4px">💡 Empfehlung für die nächste Kursstunde</h3>
    <p style="margin:0;font-size:.9rem;color:var(--grau)">Dein Kurs ist am schwächsten in
    <strong style="color:var(--rot-dkl)">${schwaechstes.icon} ${schwaechstes.name} (${kursSchnitt(schwaechstes.id)}%)</strong>.
    Unten die meist-verfehlten Fragen – ideal zum gemeinsamen Wiederholen.</p>
  </div>
  <h2>Kurs-Schnitt nach Sachgebiet</h2>
  <div class="heat">${heat}</div>
  <h2>Meist-verfehlte Fragen im Kurs</h2>
  <div class="karte">${topFehler}</div>
  <h2>Meine Prüflinge <span style="font-size:.75rem;color:var(--grau);font-weight:400">(antippen für Details)</span></h2>
  <table class="prueflinge">
    <thead><tr><th>Name</th><th>Lernstand</th><th>Lernzeit (Ist/Soll)</th><th>Simulationen</th></tr></thead>
    <tbody>${zeilen}</tbody>
  </table>`:''}

  <h2>📋 Lehrplan & Prüfungsvorgaben</h2>
  <button class="btn blau" onclick="go('lehrplan')">Lehrplan öffnen</button>
  <div style="margin-top:10px"><button class="btn ghost" onclick="state.kursDaten=null;render()">🔄 Daten aktualisieren</button></div>`;
}
let schuelerIdx=0;
function zeigeSchueler(i){ schuelerIdx=i; state.view='schueler'; render(); }

  <table class="gebiete" style="background:var(--glas);border:1px solid var(--linie);border-radius:var(--radius);box-shadow:var(--schatten);padding:8px">
    <thead><tr><th>Sachgebiet</th><th class="zahl">Lernstand</th><th style="text-align:right">Einschätzung</th></tr></thead>
    <tbody>${zeilen}</tbody>
