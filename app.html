<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050c13">
<meta name="description" content="AngelUp – Deine moderne Vorbereitung auf die Fischerprüfung. Lernen, üben, bestehen.">
<title>AngelUp – Fischerprüfung einfach bestehen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AngelUp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    /* Dark Premium – identisch zur Website (stil.css) */
    --tiefsee:#050c13; --wasser:#2ee6c5; --welle:#12b8a0; --hell:#122c3e;
    --nacht:#050c13; --tief:#081722; --flaeche:#0d2130; --flaeche-2:#122c3e; --flaeche-3:#183a4a;
    --akzent:#ffc247; --akzent2:#ff9430;
    --gruen:#35d07f; --gruen-dkl:#2fb87c; --rot:#ff6b6b; --rot-dkl:#ff9c9c;
    --karte:#0d2130; --text:#eaf3f9; --grau:#9db4c5; --grau-2:#6b8598;
    --linie:rgba(255,255,255,.10); --linie-2:rgba(255,255,255,.18);
    --glas:rgba(255,255,255,.045); --glas-2:rgba(255,255,255,.07);
    --radius:20px; --radius-s:13px;
    --schatten:0 0 0 1px rgba(255,255,255,.06), 0 18px 50px -22px rgba(0,0,0,.9);
    --schatten-hover:0 0 0 1px rgba(255,255,255,.16), 0 28px 64px -22px rgba(0,0,0,1);
    --glow-t:0 8px 30px -8px rgba(46,230,197,.45);
    --glow-g:0 8px 30px -8px rgba(255,148,48,.5);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--nacht);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(900px 620px at 12% -8%, rgba(46,230,197,.16), transparent 62%),
      radial-gradient(780px 520px at 92% 4%, rgba(255,148,48,.11), transparent 60%),
      radial-gradient(1000px 700px at 50% 108%, rgba(18,184,160,.12), transparent 65%),
      linear-gradient(180deg,#050c13 0%,#081722 45%,#050c13 100%)}
  /* Formularfelder dunkel */
  input,select,textarea{background:#0a1c28;color:var(--text);border:1.5px solid var(--linie);
    border-radius:11px;font-family:inherit}
  input::placeholder,textarea::placeholder{color:var(--grau-2)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--wasser);
    box-shadow:0 0 0 3px rgba(46,230,197,.16)}
  input[type=range]{accent-color:var(--wasser);background:transparent;border:none;box-shadow:none}
  input[type=checkbox],input[type=radio]{accent-color:var(--wasser)}
  ::selection{background:rgba(46,230,197,.3)}
  /* ---------- Kopf ---------- */
  header.top{background:rgba(8,23,34,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    color:var(--text);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:sticky;top:0;z-index:40;border-bottom:1px solid var(--linie);box-shadow:0 12px 34px -22px rgba(0,0,0,1)}
  header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(46,230,197,.55),transparent)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.12rem;letter-spacing:.2px;cursor:pointer}
  .logo svg{width:30px;height:30px}
  .logo .up{color:var(--akzent)}
  .kopf-rechts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-size:.74rem;background:var(--glas);border:1px solid var(--linie);color:var(--grau);
    padding:4px 11px;border-radius:20px;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .chip b{color:var(--akzent)}
  .chip button{background:transparent;border:none;color:var(--grau);cursor:pointer;font-size:.74rem;
    text-decoration:underline;padding:0}
  .chip button:hover{color:var(--wasser)}
  .held .zur-website{position:absolute;top:14px;left:16px;z-index:3}
  .zur-website{font-size:.74rem;color:var(--grau);text-decoration:none;border:1px solid var(--linie);
    background:var(--glas);padding:4px 11px;border-radius:20px;white-space:nowrap;transition:.15s}
  .zur-website:hover{color:var(--wasser);border-color:var(--linie-2);background:var(--glas-2)}
  main{max-width:960px;margin:0 auto;padding:22px 16px 80px}
  h1{font-size:1.6rem;margin:.2em 0 .35em;font-weight:800}
  h2{font-size:1.22rem;margin:1.4em 0 .55em;font-weight:750}
  p.lead{color:var(--grau);margin-top:0;font-size:.97rem}
  /* ---------- Karten & Buttons ---------- */
  .karte{background:linear-gradient(160deg,var(--glas-2),var(--glas));border-radius:var(--radius);padding:20px;
    box-shadow:var(--schatten);border:1px solid var(--linie);transition:.18s;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .karte.klick:hover{border-color:var(--linie-2)}
  .karte.klick{cursor:pointer}
  .karte.klick:hover{transform:translateY(-3px);box-shadow:var(--schatten-hover)}
  .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(120deg,var(--akzent),var(--akzent2));
    color:#2a1600;border:none;border-radius:13px;padding:12px 20px;font-size:.95rem;font-weight:750;
    cursor:pointer;transition:.15s;text-decoration:none;box-shadow:var(--glow-g)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px rgba(255,148,48,.65)}
  .btn.blau{background:linear-gradient(120deg,var(--wasser),var(--welle));color:#04231e;box-shadow:var(--glow-t)}
  .btn.blau:hover{box-shadow:0 14px 34px -10px rgba(46,230,197,.6)}
  .btn.gruen{background:linear-gradient(120deg,var(--gruen),#1fae67);color:#03210f;box-shadow:0 8px 30px -8px rgba(53,208,127,.5)}
  .btn.ghost{background:var(--glas);color:var(--text);border:1.5px solid var(--linie-2);box-shadow:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .btn.ghost:hover{border-color:var(--wasser);color:var(--wasser);box-shadow:none}
  .btn.gross{width:100%;padding:15px;font-size:1.03rem}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .zurueck{background:none;border:none;color:var(--wasser);cursor:pointer;font-size:.92rem;font-weight:650;padding:6px 0;margin-bottom:8px}
  .hinweis{background:rgba(255,194,71,.09);border:1px solid rgba(255,194,71,.28);border-radius:var(--radius-s);padding:11px 15px;
    font-size:.83rem;color:#f3cd7f;margin:14px 0}
  .hinweis.blau{background:rgba(46,230,197,.08);border-color:rgba(46,230,197,.26);color:#8fe8d8}
  /* ---------- Region & Rollenwahl ---------- */
  .held{position:relative;text-align:center;padding:34px 16px 10px;overflow:hidden}
  .held h1{font-size:2rem}
  .held .unter{color:var(--grau);max-width:560px;margin:0 auto 8px}
  .fischschwarm{position:absolute;inset:0;pointer-events:none;opacity:.1;z-index:-1}
  .region-karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
  .region{position:relative;text-align:left}
  .region h3{margin:24px 0 3px;font-size:1.03rem}
  .region p{margin:0;font-size:.82rem;color:var(--grau)}
  .region .bald{position:absolute;top:12px;right:12px;font-size:.68rem;font-weight:800;letter-spacing:.5px;
    background:var(--glas-2);border:1px solid var(--linie);color:var(--grau);padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .region .aktiv-tag{position:absolute;top:12px;right:12px;font-size:.68rem;font-weight:800;letter-spacing:.5px;
    background:var(--gruen);color:#03210f;padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .region.gesperrt{opacity:.55;cursor:default}
  .region.gesperrt:hover{transform:none;box-shadow:var(--schatten)}
  .rollen{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:600px){.rollen{grid-template-columns:1fr}.held h1{font-size:1.55rem}}
  /* ---------- Statuszeile / Gamification ---------- */
  .statusleiste{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 20px}
  .stat{background:linear-gradient(160deg,var(--glas-2),var(--glas));border-radius:var(--radius-s);padding:12px 14px;
    box-shadow:var(--schatten);display:flex;align-items:center;gap:11px;border:1px solid var(--linie)}
  .stat .sym{font-size:1.5rem}
  .stat .wert{font-weight:800;font-size:1.08rem;line-height:1.1}
  .stat .label{font-size:.72rem;color:var(--grau)}
  .xp-balken{height:7px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;margin-top:5px}
  .xp-balken>span{display:block;height:100%;background:linear-gradient(90deg,var(--akzent),var(--akzent2));transition:.4s}
  /* ---------- Sachgebiets-Karten ---------- */
  .gebiet-kopf{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .gebiet-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;color:#fff;flex:none}
  .gebiet-karte h3{margin:0;font-size:.99rem}
  .gebiet-karte .zahlen{font-size:.78rem;color:var(--grau)}
  .fortschritt{height:8px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;margin:9px 0 11px}
  .fortschritt>span{display:block;height:100%;border-radius:8px;transition:.4s}
  /* ---------- Quiz ---------- */
  .quizbox{background:linear-gradient(160deg,var(--glas-2),var(--glas));border-radius:var(--radius);padding:22px;
    box-shadow:var(--schatten);border:1px solid var(--linie);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .quiz-kopf{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--grau);
    margin-bottom:13px;flex-wrap:wrap;gap:8px}
  .badge{background:var(--glas-2);border:1px solid var(--linie);border-radius:20px;padding:5px 12px;font-weight:700;color:var(--wasser)}
  .badge.timer{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3);color:var(--rot-dkl);font-variant-numeric:tabular-nums}
  .badge.timer.knapp{animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.5}}
  .progressbalken{height:7px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;margin-bottom:18px}
  .progressbalken>span{display:block;height:100%;background:linear-gradient(90deg,var(--wasser),var(--gruen));transition:.3s}
  .bestehen-leiste{margin:-10px 0 16px;padding:8px 12px;border-radius:10px;background:rgba(53,208,127,.1);
    border:1px solid rgba(53,208,127,.26);font-size:.82rem;color:#8fe6b6;text-align:center;line-height:1.5}
  .frage-zeile{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
  .frage{font-size:1.14rem;font-weight:700;flex:1}
  .sprecher{background:var(--glas-2);border:1px solid var(--linie);border-radius:10px;width:40px;height:40px;font-size:1.15rem;
    cursor:pointer;flex:none;transition:.15s;color:var(--text)}
  .sprecher:hover{background:var(--flaeche-3);border-color:var(--linie-2)}
  .sprecher.an{background:var(--wasser);color:#04231e;border-color:transparent}
  .antwort{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--glas);
    border:2px solid var(--linie);border-radius:13px;padding:13px 15px;margin-bottom:10px;font-size:.95rem;
    cursor:pointer;transition:.13s;font-family:inherit;color:var(--text)}
  .antwort:hover{border-color:var(--wasser);background:var(--glas-2)}
  .antwort.gewaehlt{border-color:var(--wasser);background:rgba(46,230,197,.1);font-weight:650}
  .antwort.richtig{border-color:var(--gruen);background:rgba(53,208,127,.14);font-weight:650}
  .antwort.falsch{border-color:var(--rot);background:rgba(255,107,107,.13)}
  .antwort:disabled{cursor:default}
  .antwort .buchstabe{display:grid;place-items:center;min-width:27px;height:27px;border-radius:8px;
    background:var(--glas-2);border:1px solid var(--linie);font-weight:800;font-size:.8rem;flex:none;margin-top:1px}
  .antwort.richtig .buchstabe{background:var(--gruen);color:#03210f;border-color:transparent}
  .antwort.falsch .buchstabe{background:var(--rot);color:#2a0808;border-color:transparent}
  .erklaerung{border-radius:var(--radius-s);padding:14px 16px;font-size:.9rem;margin-top:8px;animation:auf .25s ease}
  .erklaerung.gut{background:rgba(53,208,127,.11);border-left:5px solid var(--gruen)}
  .erklaerung.schlecht{background:rgba(255,148,48,.11);border-left:5px solid var(--akzent2)}
  .erklaerung .titel{font-weight:800;margin-bottom:3px}
  .eselsbruecke{background:linear-gradient(120deg,rgba(255,194,71,.14),rgba(255,148,48,.08));border:1.5px dashed rgba(255,194,71,.55);
    border-radius:var(--radius-s);padding:13px 15px;font-size:.9rem;margin-top:10px;animation:auf .3s ease}
  .eselsbruecke .titel{font-weight:800;color:var(--akzent);display:flex;gap:7px;align-items:center}
  .hilfebox{background:rgba(46,230,197,.09);border-left:5px solid var(--wasser);border-radius:var(--radius-s);
    padding:13px 15px;font-size:.9rem;margin-top:8px;animation:auf .25s ease}
  .hilfebox .titel{font-weight:800;color:var(--wasser);margin-bottom:3px}
  .hilfe-link{background:none;border:none;color:var(--wasser);font-size:.82rem;font-weight:650;
    cursor:pointer;text-decoration:underline;padding:0;margin-top:4px}
  .fischfig{margin:6px auto 12px;padding:0;max-width:460px;text-align:center}
  .fischbild{display:block;width:100%;max-width:460px;height:auto;max-height:280px;margin:0 auto;
    background:#f2f7fb;border:1px solid var(--linie);border-radius:var(--radius-s);
    object-fit:contain;padding:6px}
  .fischfig figcaption{font-size:.7rem;color:var(--grau);margin-top:4px;line-height:1.3}
  .fischfig figcaption a{color:var(--wasser);text-decoration:none}
  .fischfig figcaption a:hover{text-decoration:underline}
  @keyframes auf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .quiz-fuss{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
  /* ---------- Ergebnis ---------- */
  .ergebnis-kreis{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;margin:12px auto;
    background:conic-gradient(var(--gruen) var(--pct,0%),rgba(255,255,255,.09) 0);position:relative}
  .ergebnis-kreis::after{content:"";position:absolute;inset:13px;background:#0a1c28;border-radius:50%}
  .ergebnis-kreis .zahl{position:relative;z-index:1;text-align:center}
  .ergebnis-kreis .zahl b{font-size:2rem;display:block}
  .status-gross{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0}
  .status-gross.bestanden{color:var(--gruen-dkl)}
  .status-gross.durchgefallen{color:var(--rot-dkl)}
  table.gebiete{width:100%;border-collapse:collapse;margin-top:14px;font-size:.88rem}
  table.gebiete th,table.gebiete td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--linie)}
  table.gebiete td.zahl{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:20px}
  .pill.ok{background:rgba(53,208,127,.15);color:#8fe6b6}
  .pill.no{background:rgba(255,107,107,.15);color:var(--rot-dkl)}
  .konfetti{position:fixed;top:-12px;font-size:1.2rem;z-index:99;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  /* ---------- Videos ---------- */
  .video-karte{display:flex;gap:13px;align-items:center}
  .video-karte .thumb{width:56px;height:56px;border-radius:14px;background:linear-gradient(140deg,var(--wasser),var(--welle));
    display:grid;place-items:center;font-size:1.5rem;flex:none;color:#04231e;box-shadow:var(--glow-t)}
  .video-karte h3{margin:0 0 2px;font-size:.95rem}
  .video-karte p{margin:0;font-size:.78rem;color:var(--grau)}
  a.extern{color:var(--wasser);font-weight:700;text-decoration:none;font-size:.85rem}
  a.extern:hover{text-decoration:underline}
  /* ---------- Ausbilder ---------- */
  table.prueflinge{width:100%;border-collapse:collapse;font-size:.87rem;background:var(--glas);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--schatten);border:1px solid var(--linie)}
  table.prueflinge th{background:rgba(46,230,197,.14);color:var(--wasser);text-align:left;padding:12px;font-size:.8rem;
    text-transform:uppercase;letter-spacing:.6px}
  table.prueflinge td{padding:12px;border-bottom:1px solid var(--linie)}
  table.prueflinge tr:last-child td{border-bottom:none}
  table.prueflinge tr.klick{cursor:pointer}
  table.prueflinge tr.klick:hover td{background:var(--glas-2)}
  .mini-balken{height:8px;width:90px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;display:inline-block;
    vertical-align:middle;margin-right:8px}
  .mini-balken>span{display:block;height:100%}
  .heat{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
  .heat .zelle{border-radius:var(--radius-s);padding:11px 8px;text-align:center;color:#04231e;font-weight:800;font-size:1.02rem}
  .heat .zelle small{display:block;font-weight:650;font-size:.62rem;opacity:.9;margin-top:2px;line-height:1.25}
  @media(max-width:700px){.heat{grid-template-columns:repeat(3,1fr)}}
  .code-box{background:rgba(46,230,197,.1);border:1px solid rgba(46,230,197,.3);color:var(--wasser);font-family:ui-monospace,monospace;
    font-size:1.25rem;letter-spacing:3px;padding:12px 22px;border-radius:12px;display:inline-block;font-weight:800}
  .fehlerfrage{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--linie);font-size:.88rem}
  .fehlerfrage b{color:var(--rot-dkl)}
  .abzeichen{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .abzeichen .ab{background:var(--glas);border:1.5px solid var(--linie);border-radius:14px;padding:9px 13px;font-size:.8rem;
    display:flex;gap:7px;align-items:center}
  .abzeichen .ab.holt{border-color:rgba(255,194,71,.55);background:rgba(255,194,71,.12);color:var(--akzent)}
  .abzeichen .ab.grau{opacity:.45;filter:grayscale(1)}
  .fisch-deko{display:block;margin:0 auto;max-width:210px;opacity:.9;filter:drop-shadow(0 10px 26px rgba(46,230,197,.28))}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================================
   ANGELUP – Fischerprüfung einfach bestehen (Prototyp v2)
   Erreichbar später über: angelup.de + angelscheinwerk.de
   Regionen: Weser-Ems aktiv · NRW / Niedersachsen (Binnen) / Bremen folgen
   Prüfungsregeln Weser-Ems (offiziell, Prüfungsordnung AFV Stand 2026):
   60 Fragen · 3 Antworten · 60 Min · bestanden ab 45/60 UND ≥6 je Sachgebiet
   FRAGEN: aktuell selbst erstellte Beispiele – werden durch den offiziellen
   Katalog (360 Fragen, Stand 2024) ersetzt, sobald sauber eingelesen.
   ========================================================================= */

const REGIONEN = [
  {id:"weser-ems", name:"Weser-Ems", traeger:"Angelfischerverband im LFV Weser-Ems e.V.", aktiv:true,
   regeln:{fragenGesamt:60, fragenProGebiet:10, zeitMinuten:60, bestehenGesamt:45, bestehenProGebiet:6}},
  {id:"niedersachsen", name:"Niedersachsen (Binnen)", traeger:"AVN – Anglerverband Niedersachsen", aktiv:false},
  {id:"nrw", name:"Nordrhein-Westfalen", traeger:"Staatliche Fischerprüfung NRW", aktiv:false},
  {id:"bremen", name:"Bremen", traeger:"Fischerprüfung Land Bremen", aktiv:false}
];

const GEBIETE = [
  {id:1, name:"Allgemeine Fischkunde", kurz:"Allg. Fischkunde", farbe:"#3fb0e0", icon:"🐟"},
  {id:2, name:"Spezielle Fischkunde",  kurz:"Spez. Fischkunde", farbe:"#35c98d", icon:"🎣"},
  {id:3, name:"Gewässerkunde",         kurz:"Gewässerkunde",    farbe:"#2cc2d6", icon:"🌊"},
  {id:4, name:"Fischfang & Gerätekunde",kurz:"Gerätekunde",     farbe:"#e8b33c", icon:"🪝"},

const FRAGEN = [
  /* ============ 1 · ALLGEMEINE FISCHKUNDE (Fragen 30–60) ============ */
  {g:1,f:"Wo befindet sich beim Fisch die Gallenblase?",a:["am Dünndarm","an der Leber","an den Nieren"],r:1,e:"Die Gallenblase sitzt an der Leber. Sie darf beim Ausweiden nicht verletzt werden, sonst wird das Fleisch bitter."},
  {g:1,f:"Bei welchen Süßwasserfischen hat die Leber eine andere Farbe als rotbraun?",a:["bei Forellen und Lachsen","bei Barschen und Karpfen","bei Hechten und Quappen"],r:2,e:"Bei Hecht und Quappe ist die Leber anders (heller/gelblich) gefärbt als die typisch rotbraune Leber der meisten Süßwasserfische."},
  {g:1,f:"Wie ist die gesunde Leber bei den meisten Süßwasserfischen gefärbt?",a:["rotbraun","grün","weißlich, gelblich"],r:0,e:"Eine gesunde Fischleber ist bei den meisten Arten rotbraun. Verfärbungen können auf Krankheit hindeuten."},
  {g:1,f:"Wo liegen die Nieren beim Fisch?",a:["unter der Wirbelsäule vom Kopf bis teilweise hinter dem After","über der Wirbelsäule bis zum Schwanzende","der Fisch hat keine Nieren"],r:0,e:"Die Nieren liegen als dunkler Streifen direkt unter der Wirbelsäule. Beim Ausweiden restlos entfernen."},
  {g:1,f:"Worauf sollte beim Ausweiden eines Fisches zum Verzehr unbedingt geachtet werden?",a:["Gallenblase nicht zerschneiden, Nieren restlos entfernen","den Fisch in möglichst viele kleine Stücke schneiden","da gibt es nichts zu beachten, Fisch schmeckt immer"],r:0,e:"Geplatzte Galle macht das Fleisch bitter, Nierenreste verderben schnell – beides sorgfältig entfernen."},
  {g:1,f:"An welcher Stelle des Fischschädels ist das Gehirn zu finden?",a:["zwischen Augenhinterrand und Schädelende","über den Nasengruben","unter dem ersten Rückenwirbel"],r:0,e:"Das Gehirn liegt zwischen Augenhinterrand und Schädelende – wichtig zu wissen für das korrekte Betäuben."},
  {g:1,f:"Warum ist es wichtig, die Lage des Fischhirnes zu kennen?",a:["um den Fisch vorschriftsmäßig betäuben zu können","um ihn durch Gehirnstich ausbluten zu lassen","um Gleichgewichtsstörungen beurteilen zu können"],r:0,e:"Nur mit Kenntnis der Hirnlage lässt sich der Fisch mit einem gezielten Schlag wirksam betäuben."},
  {g:1,f:"Wie muss der Fisch wirksam betäubt werden?",a:["durch einen kräftigen Schlag auf die Schädeldecke oberhalb des Gehirns","durch einen Herzstich","durch Durchtrennen der Wirbelsäule"],r:0,e:"Betäubt wird mit einem kräftigen Schlag auf die Schädeldecke oberhalb des Gehirns; erst danach folgt der Herzstich."},
  {g:1,f:"Wo verläuft der Hauptnervenstrang bei Fischen?",a:["in der Wirbelsäule","an der Seitenlinie","im Fischkörper, unterseits der Bauchhöhle"],r:0,e:"Das Rückenmark (Hauptnervenstrang) verläuft im Kanal der Wirbelsäule."},
  {g:1,f:"Wozu dient das Seitenlinienorgan?",a:["Messung der Wassertemperatur","Abwehr von Krankheitserregern","Wahrnehmung von Wasserschwingungen/-strömungen"],r:2,e:"Über die Seitenlinie nimmt der Fisch Druckwellen und Strömungen wahr – eine Art „Ferntastsinn“."},
  {g:1,f:"Bei welchen Fischen ist das Seitenlinienorgan am Kopf besonders stark entwickelt?",a:["bei Hechten und Zandern","bei den Karpfenartigen (Cypriniden) und beim Aal","bei Bitterlingen"],r:1,e:"Cypriniden und Aal orientieren sich stark über Tast- und Strömungssinn – ihr Seitenliniensystem am Kopf ist besonders ausgeprägt."},
  {g:1,f:"Wie ist der Geschmackssinn der Fische ausgebildet?",a:["schlecht","gar nicht","sehr gut"],r:2,e:"Fische haben einen sehr gut ausgebildeten Geschmackssinn."},
  {g:1,f:"Wo sind beim Fisch die Geschmacksknospen angeordnet?",a:["nur an der Schwanzflosse","nur auf der Zunge","am ganzen Körper"],r:2,e:"Geschmacksknospen sitzen über den ganzen Körper verteilt, gehäuft am Kopf."},
  {g:1,f:"Wo sind die Geschmacksknospen beim Fisch am häufigsten zu finden?",a:["am Kopf, an den Lippen und Barteln","an den Brust- und Bauchflossen","auf den Schuppen"],r:0,e:"Am dichtesten sitzen die Geschmacksknospen am Kopf, an Lippen und Barteln."},
  {g:1,f:"Bei welchen Fischen ist der Geschmackssinn besonders gut ausgebildet?",a:["bei den Karpfenartigen (Cypriniden) und beim Aal","bei den Barschartigen (Perciden)","bei Hechten und Zandern"],r:0,e:"Cypriniden und Aal suchen ihre Nahrung stark über den Geschmack – dieser ist bei ihnen besonders ausgeprägt."},
  {g:1,f:"Wie ist das Auge des Fisches beschaffen?",a:["normalsichtig, Hell- und Dunkelsehen schlecht","weitsichtig, Hell- und Dunkelsehen gar nicht","kurzsichtig, Hell- und Dunkelsehen gut"],r:2,e:"Fische sind kurzsichtig, können aber hell und dunkel gut unterscheiden."},
  {g:1,f:"Können Fische aus dem Wasser heraussehen?",a:["ja, aber begrenzt","nur, wenn die Sonne scheint","nein, überhaupt nicht"],r:0,e:"Durch das „Snellsche Fenster“ können Fische begrenzt aus dem Wasser heraussehen."},
  {g:1,f:"Welche Geräusche können Fische wahrnehmen?",a:["keine, denn Fische haben keine Ohren","einige, aber nur sehr undeutlich","alle durch das Wasser übertragenen Schallwellen werden wahrgenommen"],r:2,e:"Fische besitzen ein Innenohr und die Seitenlinie – sie nehmen im Wasser übertragene Schallwellen wahr."},
  {g:1,f:"Welcher Fisch wird als Milchner bezeichnet?",a:["eine besondere Fischart","der weibliche Fisch","der männliche Fisch"],r:2,e:"Der Milchner ist der männliche Fisch (Samen = Milch). Das Weibchen heißt Rogner."},
  {g:1,f:"Was ist ein Rogner?",a:["ein weiblicher Fisch","ein männlicher Fisch","ein Fisch, der sich nicht zur Fortpflanzung eignet"],r:0,e:"Der Rogner ist der weibliche Fisch (Eier = Rogen)."},
  {g:1,f:"Was ist ein Laichhaken?",a:["ein spezieller Angelhaken","eine hakenartige Ausbildung des Unterkiefers beim Milchner großmauliger Salmoniden","ein Gaff zum Fangen großer Laichfische"],r:1,e:"Der Laichhaken ist die hakenförmige Verformung des Unterkiefers bei männlichen Salmoniden zur Laichzeit."},
  {g:1,f:"Welche Fische sind Sommerlaicher?",a:["Hecht, Barsch, Zander","Karpfen, Wels, Schleie","Quappe, Bachforelle"],r:1,e:"Karpfen, Wels und Schleie laichen im warmen Wasser des Sommers."},
  {g:1,f:"Fische werden als Sommerlaicher bezeichnet, wenn sie …",a:["bei einer Wassertemperatur von weniger als 10 °C laichen","erst im August ablaichen","bei einer Wassertemperatur von 17 °C und mehr laichen"],r:2,e:"Sommerlaicher laichen bei Wassertemperaturen von etwa 17 °C und mehr."},
  {g:1,f:"Welche Fische laichen im Herbst und Winter?",a:["Quappe, Bach-, Meer- und Seeforelle, Lachs","Äsche und Barbe","Brassen, Döbel, Aland und Rotauge"],r:0,e:"Quappe, die Forellen und der Lachs laichen im Herbst/Winter bei niedrigen Temperaturen."},
  {g:1,f:"Bei welchen Fischen dauert die natürliche Entwicklung des Laichs am längsten?",a:["bei den Herbst- und Winterlaichern","bei den Frühjahrslaichern","bei den Sommerlaichern"],r:0,e:"Im kalten Wasser entwickelt sich der Laich am langsamsten – bei den Herbst- und Winterlaichern dauert es am längsten."},
  {g:1,f:"Welcher Süßwasserfisch produziert die meisten Eier?",a:["Dreistachliger Stichling","Hecht","Karpfen"],r:2,e:"Der Karpfen produziert die meisten Eier (bis über eine Million pro kg Körpergewicht)."},
  {g:1,f:"Welcher Fisch legt seine Eier in selbstgebaute Nester?",a:["Dreistachliger Stichling","Karpfen","Bitterling"],r:0,e:"Der Dreistachlige Stichling baut ein Nest, das das Männchen bewacht."},
  {g:1,f:"Welcher Fisch legt seine Eier in Muscheln?",a:["Schlammpeitzger","Bitterling","Gründling"],r:1,e:"Der Bitterling legt seine Eier mit einer Legeröhre in Teich- und Flussmuscheln ab."},
  {g:1,f:"Was sind Wanderfische?",a:["Fische, die zur Nahrungssuche weit schwimmen","Fische, die weite Wege zu ihren Laichplätzen zurücklegen","Fische, die nicht standorttreu sind"],r:1,e:"Wanderfische (z. B. Lachs, Aal) legen weite Strecken zu ihren Laichplätzen zurück."},
  {g:1,f:"Welcher Fisch wandert zum Laichen vom Süßwasser ins Salzwasser?",a:["Lachs","Aal","Zander"],r:1,e:"Der Aal wandert zum Laichen ins Meer (Sargassosee) – er ist katadrom. Der Lachs macht es umgekehrt."},
  {g:1,f:"Dürfen klar erkennbar kranke, gefangene Fische ins Gewässer zurückgesetzt werden?",a:["ja, denn jede Krankheit heilt aus","nein","ja, denn kranke Fische dienen als Nahrung für Raubfische"],r:1,e:"Klar erkennbar kranke Fische dürfen nicht zurückgesetzt werden, um eine Ausbreitung der Krankheit zu verhindern."},

  /* ============ 2 · SPEZIELLE FISCHKUNDE (Fragen 1–50) ============ */
  {g:2,f:"Welche Arten gehören zu den Rundmäulern?",a:["Rotauge und Brassen","Bach-, Fluss- und Meerneunaugen","Zander und Hecht"],r:1,e:"Die Neunaugen sind Rundmäuler (Cyclostomata) – keine echten Fische, sondern kieferlose Wirbeltiere."},
  {g:2,f:"Was für ein Skelett haben Neunaugen?",a:["ein Knochenskelett","ein knorpeliges Skelett","sie haben kein Stützskelett"],r:1,e:"Neunaugen besitzen ein knorpeliges Skelett."},
  {g:2,f:"Woher hat das Neunauge seinen Namen?",a:["es hat ein Nasenloch und auf jeder Seite ein Auge sowie sieben Kiemenöffnungen","es hat neun Augen","es hat nur ein Auge an jeder Seite, aber neun Kiemenöffnungen"],r:0,e:"Nasenloch + Auge + sieben Kiemenöffnungen ergeben je Seite „neun Augen“ – daher der Name."},
  {g:2,f:"Welche der aufgeführten Fischarten hat das geringste Sauerstoffbedürfnis?",a:["Karausche","Bachforelle","Hecht"],r:0,e:"Die Karausche ist extrem anspruchslos und übersteht sauerstoffarme Gewässer."},
  {g:2,f:"Welche Fische haben Schlundzähne?",a:["Karpfenartige (Cypriniden)","Lachs-/Forellenartige (Salmoniden)","Barschartige (Perciden)"],r:0,e:"Cypriniden haben keine Kieferzähne, sondern Schlundzähne zum Zerkleinern der Nahrung."},
  {g:2,f:"Welche unveränderlichen Merkmale zieht man bei den Karpfenartigen (Cypriniden) zur Artbestimmung heran?",a:["Anzahl und Stellung der Schlundzähne","Form der Hautzähne","Schuppenreihe an der Fettflosse"],r:0,e:"Anzahl und Stellung der Schlundzähne sind artspezifisch und unveränderlich – ideal zur Bestimmung."},
  {g:2,f:"Bei welchen Fischen sind die Kiefer bezahnt?",a:["Brassen (Blei), Güster, Zährte","Aland, Döbel, Hasel","Forelle, Hecht, Barsch"],r:2,e:"Forelle, Hecht und Barsch (Raubfische) haben bezahnte Kiefer. Cypriniden haben keine Kieferzähne."},
  {g:2,f:"In welcher Aufstellung ist die Anzahl der Barteln bei den Fischen richtig angegeben?",a:["Schleie-1, Quappe-4, Karpfen-6, Wels-2, Barbe-2, Gründling-4","Schleie-2, Quappe-1, Karpfen-4, Wels-6, Barbe-4, Gründling-2","Schleie-2, Quappe-6, Karpfen-6, Wels-4, Barbe-2, Gründling-2"],r:1,e:"Richtig: Schleie 2, Quappe 1, Karpfen 4, Wels 6, Barbe 4, Gründling 2."},
  {g:2,f:"Welcher Fisch hat die meisten Barteln?",a:["Wels","Barbe","Schlammpeitzger"],r:2,e:"Der Schlammpeitzger hat 10 Barteln – mehr als jeder andere heimische Fisch."},
  {g:2,f:"Welcher Fisch hat keine Barteln?",a:["Barbe","Nase","Quappe"],r:1,e:"Die Nase hat keine Barteln; sie erkennt man am unterständigen Maul mit verhornter Lippe."},
  {g:2,f:"Welcher Fisch hat nur eine Bartel an der Unterlippe?",a:["Wels","Quappe","Barbe"],r:1,e:"Die Quappe (einziger heimischer Süßwasser-Dorschartiger) trägt eine einzelne Bartel am Kinn."},
  {g:2,f:"Zu welcher Maulform sind die Fischarten richtig eingeordnet?",a:["unterständiges Maul: Nase, Barbe","unterständiges Maul: Flussbarsch, Zander, Rapfen","oberständiges Maul: Karpfen, Schleie, Zander"],r:0,e:"Nase und Barbe haben ein unterständiges Maul (Grundfische)."},
  {g:2,f:"Welche Fische heften ihren Laich hauptsächlich an Pflanzen und Gestrüpp?",a:["Brassen, Schleie, Karpfen, Flussbarsch und Hecht","Bachforelle, Lachs und Elritze","Barbe, Quappe und Äsche"],r:0,e:"Diese Arten sind Krautlaicher – sie kleben ihre Eier an Wasserpflanzen."},
  {g:2,f:"Welche Flossenstellung ist für das Rotauge (Plötze) kennzeichnend?",a:["die Rückenflosse beginnt senkrecht über dem Ansatz der Bauchflossen","die Rückenflosse beginnt senkrecht über dem Ansatz der Brustflossen","die Rückenflosse endet senkrecht vor dem Ansatz der Bauchflossen"],r:0,e:"Beim Rotauge beginnt die Rückenflosse senkrecht über dem Ansatz der Bauchflossen – Unterscheidung zur Rotfeder."},
  {g:2,f:"Wie sieht der Döbel aus?",a:["großer Kopf, netzartige Zeichnung, breites Maul","hochrückig, bezahnte Kiefer, Fettflosse","lange Afterflosse"],r:0,e:"Der Döbel hat einen großen breiten Kopf und ein netzartiges Schuppenmuster."},
  {g:2,f:"Wie sieht der Aland aus?",a:["torpedoförmiger Körper","Maul oberständig, Körperquerschnitt rund","endständiges Maul, etwas hochrückiger Körper"],r:2,e:"Der Aland hat ein endständiges Maul und einen etwas hochrückigen Körper."},
  {g:2,f:"Welcher Fisch hat ein vorstülpbares Rüsselmaul?",a:["Hecht","Flussbarsch","Brassen"],r:2,e:"Der Brassen (Cyprinide) kann sein Maul rüsselartig vorstülpen, um Nahrung vom Grund aufzunehmen."},
  {g:2,f:"Welche Körperform hat die Güster?",a:["pfeilförmig","torpedoförmig","hochrückig, seitlich zusammengedrückt"],r:2,e:"Die Güster ist wie der Brassen hochrückig und seitlich stark abgeflacht."},
  {g:2,f:"Woran erkennt man den Schuppenkarpfen?",a:["vollständiges Schuppenkleid","Schuppen entlang der Seitenlinie und an den Flossenansätzen","keine oder nur ganz wenige verteilte Schuppen"],r:0,e:"Der Schuppenkarpfen ist vollständig beschuppt (im Gegensatz zu Spiegel- und Lederkarpfen)."},
  {g:2,f:"In welchem Gewässerbereich hält sich die Schleie bevorzugt auf?",a:["Freiwasserzone","Gewässergrund","direkt an der Oberfläche"],r:1,e:"Die Schleie ist ein Grundfisch und hält sich bevorzugt am krautigen Gewässergrund auf."},
  {g:2,f:"Bei welcher Fischart ist der Rogen giftig?",a:["Barbe","Wels","Quappe"],r:0,e:"Der Rogen (die Eier) der Barbe ist giftig und kann Übelkeit/Erbrechen auslösen."},
  {g:2,f:"Welcher barschartige Fisch hat keinen spitzen Dorn am Kiemendeckel?",a:["Zander","Kaulbarsch","Flussbarsch"],r:1,e:"Der Kaulbarsch besitzt keinen spitzen Dorn am Kiemendeckel."},
  {g:2,f:"Welches unveränderliche Merkmal erlaubt die Unterscheidung des Jungzanders von anderen Barschartigen?",a:["die blassere Färbung des Körpers","der fehlende spitze Dorn am Kiemendeckel","die nicht geteilte Rückenflosse"],r:0,e:"Der Jungzander ist blasser gefärbt; zusätzlich hat er (im Unterschied zum Kaulbarsch) zwei getrennte Rückenflossen und Hundszähne."},
  {g:2,f:"Welcher Fisch klebt die Eier überwiegend an Wurzelwerk, Totholz und Steine?",a:["Bachforelle","Bitterling","Zander"],r:2,e:"Der Zander legt seine Eier an Wurzeln, Totholz und Steine und bewacht das Gelege."},
  {g:2,f:"Welche Beschreibung trifft auf den Kaulbarsch zu?",a:["er hat nur hartstrahlige Flossen","zwischen der hart- und weichstrahligen Rückenflosse besteht eine Lücke","hartstrahlige Rückenflosse ist mit der weichstrahligen durch Flossenhaut verbunden"],r:2,e:"Beim Kaulbarsch sind hart- und weichstrahlige Rückenflosse durch Flossenhaut zu einer Flosse verbunden."},
  {g:2,f:"Wo laicht der Europäische Aal?",a:["in den Flüssen","im Wattenmeer","in der Sargassosee"],r:2,e:"Der Europäische Aal wandert zum Laichen in die Sargassosee im Atlantik."},
  {g:2,f:"Was sind Glasaale?",a:["Aale im Jugendstadium; ihr Körper ist transparent","Aale, die von einer Krankheit befallen sind","eine Kümmerform des Aales"],r:0,e:"Glasaale sind die durchsichtigen Jungaale, die vom Meer ins Süßwasser aufsteigen."},
  {g:2,f:"Was sind Blankaale?",a:["hell gefärbte Aale mit breiter Maulspalte","Aale, die in das Süßwasser aufsteigen","Aale, die zum Laichen abwandern"],r:2,e:"Blankaale sind die geschlechtsreifen Aale, die silbrig gefärbt zum Laichen ins Meer abwandern."},
  {g:2,f:"Welche Merkmale weist der zum Laichen abwandernde Aal auf?",a:["Rücken dunkel, Bauch silberglänzend, eingezogener After, erweiterte Augen, großer Fettgehalt","Gelbfärbung","hoher Fettgehalt, kleine Augen, wesentlich vergrößerte Flossen"],r:0,e:"Der abwandernde Blankaal ist silbrig, hat vergrößerte Augen und einen hohen Fettvorrat für die weite Wanderung."},
  {g:2,f:"Wie oft laicht der Aal in seinem Leben ab?",a:["einmal","dreimal","jedes Jahr"],r:0,e:"Der Aal laicht nur einmal in seinem Leben und stirbt danach."},
  {g:2,f:"Welche Fische haben keine Bauchflossen?",a:["Schleie und Barbe","Hecht und Zander","Meeraal (Conger) und Flussaal"],r:2,e:"Aale besitzen keine Bauchflossen; Rücken-, Schwanz- und Afterflosse bilden einen durchgehenden Saum."},
  {g:2,f:"Wie unterscheidet man die Quappe vom Wels?",a:["sie hat eine Bartel und eine geteilte, lang ausgezogene Rücken- und Afterflosse","sie hat sechs Barteln und eine kleine vorn liegende Rückenflosse","sie hat vier Barteln und kehlständige Bauchflossen"],r:0,e:"Die Quappe hat nur eine Kinnbartel und lang ausgezogene Rücken- und Afterflossen; der Wels hat sechs Barteln."},
  {g:2,f:"Welcher im Süßwasser lebende Fisch hat kehlständige Bauchflossen?",a:["Flussbarsch","Quappe","Aal"],r:1,e:"Die Quappe hat kehlständige Bauchflossen (vor den Brustflossen)."},
  {g:2,f:"Wodurch unterscheidet sich der Wels vom Zwerg- oder Katzenwels? Der Wels hat …",a:["einen langen Rückenflossensaum und sechs gleichlange Barteln","keine Barteln und einen langen Rücken- und Afterflossensaum","vier kürzere Barteln am Unterkiefer und zwei sehr lange am Oberkiefer"],r:2,e:"Der Wels hat zwei sehr lange Barteln am Oberkiefer und vier kürzere am Unterkiefer sowie nur eine kleine Rückenflosse."},
  {g:2,f:"Durch welches deutlich sichtbare Merkmal unterscheiden sich Lachsartige (Salmoniden) von Karpfenartigen (Cypriniden)?",a:["durch die Fettflosse","durch die Stachelstrahlen","durch einen geschlossenen Flossensaum um den Hinterkörper"],r:0,e:"Salmoniden besitzen als Erkennungsmerkmal eine kleine Fettflosse zwischen Rücken- und Schwanzflosse."},
  {g:2,f:"Welche Fische bevorzugen klares, kühles und sauerstoffreiches Wasser?",a:["Karpfenartige (Cypriniden)","Lachsartige (Salmoniden)","Welse"],r:1,e:"Salmoniden brauchen kühles, klares, sauerstoffreiches Wasser (Forellenregion)."},
  {g:2,f:"Welche Fische haben den höchsten Sauerstoffbedarf?",a:["Karauschen","Zander","Forellen"],r:2,e:"Forellen (Salmoniden) haben den höchsten Sauerstoffbedarf."},
  {g:2,f:"Welche Lachsartigen (Salmoniden) sind einheimische Fische?",a:["Regenbogenforellen","Bachsaiblinge","Bach- und Meerforellen"],r:2,e:"Bach- und Meerforelle sind heimisch; Regenbogenforelle und Bachsaibling wurden aus Nordamerika eingeführt."},
  {g:2,f:"Welche Fischarten sind in Europa nicht heimisch?",a:["Äsche und Wels","Bach- und Meerforellen","Bachsaibling und Regenbogenforelle"],r:2,e:"Bachsaibling und Regenbogenforelle stammen aus Nordamerika und sind bei uns nicht heimisch."},
  {g:2,f:"Welche Fischarten sind Kieslaicher?",a:["Nase, Barbe, Bach- und Meerforellen","Hecht, Zander, Barsch, Brassen","Karpfen, Schleie, Rotauge, Karausche"],r:0,e:"Nase, Barbe und die Forellen laichen auf kiesigem Untergrund (Kieslaicher)."},
  {g:2,f:"Wo laicht die Bachforelle?",a:["an Kraut","im Freiwasser","auf kiesigem Untergrund"],r:2,e:"Die Bachforelle ist ein Kieslaicher und legt ihre Eier in Laichgruben im Kies ab."},
  {g:2,f:"Woran erkenne ich den Äschenmilchner?",a:["an den stärker ausgeprägten Bauchflossen","an der lang ausgezogenen Afterflosse mit vielen schwarzen Punkten","an der wimpelartig lang ausgezogenen Rückenflosse"],r:2,e:"Das Äschenmännchen hat eine besonders große, wimpelartig ausgezogene Rückenflosse (Fahne)."},
  {g:2,f:"Woran erkennt man bei den meisten großmauligen Lachsartigen (Salmoniden) den Milchner?",a:["am größeren Kopf und am Laichhaken","am Laichausschlag","am vorstülpbaren Rüsselmaul"],r:0,e:"Männchen großmauliger Salmoniden erkennt man am größeren Kopf und am Laichhaken des Unterkiefers."},
  {g:2,f:"Bei welcher Fischart aus der Familie der Lachsartigen (Salmoniden) haben die paarigen Flossen und die Afterflosse einen weiß-schwarzen Saum?",a:["Bachsaibling","Regenbogenforelle","Bachforelle"],r:0,e:"Der Bachsaibling hat den typischen weiß-schwarzen Saum an den unteren Flossen."},
  {g:2,f:"Wie unterscheidet sich die Regenbogenforelle von der Bachforelle?",a:["die Regenbogenforelle hat eine unterständige Maulspalte","sie hat auf beiden Seiten des Körpers ein rosa schillerndes Längsband","die Männchen bilden im Alter keinen Laichhaken am Unterkiefer aus"],r:1,e:"Die Regenbogenforelle trägt ein rosa/violett schillerndes Längsband auf beiden Körperseiten."},
  {g:2,f:"Welche Fische sind Dorschartige?",a:["Makrele, Hornhecht, Aalmutter","Steinbutt, Scholle, Flunder","Köhler, Wittling, Schellfisch"],r:2,e:"Köhler, Wittling und Schellfisch gehören zu den Dorschartigen (Gadidae)."},
  {g:2,f:"Welche Arten sind Plattfische?",a:["Rotauge und Brassen","Hering und Maifisch","Scholle und Flunder"],r:2,e:"Scholle und Flunder sind Plattfische."},
  {g:2,f:"Woran ist der Hornhecht zu erkennen?",a:["schnabelartiges Maul, grüne Gräten und langgestreckter Körper","die zweite Rückenflosse ist größer als die erste","er hat eine besonders große Afterflosse und zwei Rückenflossen"],r:0,e:"Der Hornhecht hat ein schnabelartiges Maul, einen langgestreckten Körper und auffällig grün gefärbte Gräten."},
  {g:2,f:"Welcher Fisch ist das?",bild:"rotauge",a:["Rotfeder","Rotauge","Güster"],r:1,e:"Das Rotauge (Plötze) hat die Rückenflosse SENKRECHT über dem Bauchflossenansatz und ein rotes Auge – so unterscheidet man es von der Rotfeder."},
  {g:2,f:"Welcher Fisch ist das?",bild:"brassen",a:["Brassen","Karausche","Karpfen"],r:0,e:"Der Brassen (Blei) ist extrem hochrückig, seitlich abgeflacht, bronzefarben und hat eine sehr lange Afterflosse."},
  {g:2,f:"Welcher Fisch ist das?",bild:"karpfen",a:["Karausche","Schleie","Karpfen"],r:2,e:"Der Karpfen erkennt man an den 4 Barteln (2 kurze oben, 2 lange unten) und der langen Rückenflosse."},
  {g:2,f:"Welcher Fisch ist das?",bild:"hecht",a:["Zander","Hecht","Wels"],r:1,e:"Der Hecht hat ein entenschnabelartig verlängertes Maul, hellen Fleckenmuster und die Rückenflosse steht WEIT hinten gegenüber der Afterflosse."},
  {g:2,f:"Welcher Fisch ist das?",bild:"zander",a:["Barsch","Hecht","Zander"],r:2,e:"Der Zander hat 2 getrennte Rückenflossen (vordere stachelig), schwache Querbänder und ist deutlich schlanker als der Barsch."},
  {g:2,f:"Welcher Fisch ist das?",bild:"barsch",a:["Zander","Flussbarsch","Kaulbarsch"],r:1,e:"Der Flussbarsch hat 5–9 dunkle Querbänder, einen schwarzen Fleck am Ende der vorderen Rückenflosse und leuchtend orange-rote Brustflossen."},
  {g:2,f:"Welcher Fisch ist das?",bild:"bachforelle",a:["Regenbogenforelle","Bachforelle","Bachsaibling"],r:1,e:"Die Bachforelle hat rote und schwarze Tupfen (oft mit hellem Hof), keinen weißen Flossensaum und kein rosa Längsband."},
  {g:2,f:"Welcher Fisch ist das?",bild:"regenbogenforelle",a:["Bachforelle","Bachsaibling","Regenbogenforelle"],r:2,e:"Die Regenbogenforelle trägt ein rosa/violett schillerndes Längsband über die ganze Flanke und viele kleine schwarze Punkte auch auf den Flossen."},
  {g:2,f:"Welcher Fisch ist das?",bild:"bachsaibling",a:["Bachforelle","Bachsaibling","Regenbogenforelle"],r:1,e:"Der Bachsaibling hat helle Flecken auf dunklem Rücken, rote Punkte mit blauem Hof und typische weiß-schwarze Ränder an den unteren Flossen."},
  {g:2,f:"Welcher Fisch ist das?",bild:"aal",a:["Neunauge","Wels","Aal"],r:2,e:"Der Aal hat einen extrem langgestreckten, schlangenförmigen Körper und einen durchgehenden Flossensaum vom Rücken um den Schwanz bis zum Bauch."},
  {g:2,f:"Welcher Fisch ist das?",bild:"wels",a:["Aal","Wels","Quappe"],r:1,e:"Der Wels hat einen massiven, breiten Kopf, 2 lange und 4 kürzere Barteln, eine winzige Rückenflosse und eine extrem lange Afterflosse."},
  {g:2,f:"Welcher Fisch ist das?",bild:"schleie",a:["Karpfen","Schleie","Karausche"],r:1,e:"Die Schleie hat sehr kleine dichte Schuppen, abgerundete Flossen und 2 winzige Barteln – kein Vergleich zum Karpfen mit 4 Barteln."},
  {g:2,f:"Welcher Fisch ist das?",bild:"rotfeder",a:["Rotauge","Rotfeder","Güster"],r:1,e:"Die Rotfeder hat die Rückenflosse deutlich HINTER dem Bauchflossenansatz (Unterschied zum Rotauge), leuchtend rote Flossen und ein gelbes Auge."},
  {g:2,f:"Welcher Fisch ist das?",bild:"karausche",a:["Karpfen","Karausche","Schleie"],r:1,e:"Die Karausche ist hochrückig, hat KEINE Barteln (Unterschied zum Karpfen) und eine lange Rückenflosse mit vielen Strahlen."},
  {g:2,f:"Welcher Fisch ist das?",bild:"barbe",a:["Nase","Barbe","Döbel"],r:1,e:"Die Barbe hat einen langgestreckten Körper, ein unterständiges Maul und 4 Barteln – ein typischer Grundfisch der Barbenregion."},
  {g:2,f:"Welcher Fisch ist das?",bild:"dorsch",a:["Wittling","Köhler","Dorsch"],r:2,e:"Der Dorsch (Kabeljau) hat 3 Rückenflossen, 2 Afterflossen und eine typische Kinnbartel am Unterkiefer."},
  {g:2,f:"Welcher Fisch ist das?",bild:"hornhecht",a:["Hornhecht","Makrele","Meerforelle"],r:0,e:"Der Hornhecht hat ein schnabelartig verlängertes Maul, einen extrem langgestreckten Körper – und typischerweise grüne Gräten."},

  /* ============ 3 · GEWÄSSERKUNDE (Fragen 1–53) ============ */
  {g:3,f:"Welches Wasser ist in der Regel sauerstoffarm?",a:["Wasser in Teichen","das Wasser kalter, klarer Gebirgsbäche","Grundwasser"],r:2,e:"Grundwasser hat wegen fehlendem Kontakt zur Luft und zu Pflanzen kaum gelösten Sauerstoff."},
  {g:3,f:"Bei welcher Temperatur ist Wasser am dichtesten und damit am schwersten?",a:["- 4°C","0°C","+ 4°C"],r:2,e:"Wasser hat bei +4°C seine höchste Dichte – deshalb friert ein See von oben und nicht von unten zu."},
  {g:3,f:"Welches Gewässer ist am sauerstoffhaltigsten?",a:["kalter, klarer Bergbach","Brackwasser","warmes, stehendes Gewässer"],r:0,e:"Kaltes, klares, strömendes Wasser kann am meisten Sauerstoff lösen und wird durch die Strömung gut durchmischt."},
  {g:3,f:"Welchen Einfluss hat die Wassertemperatur auf den Sauerstoffgehalt?",a:["im kalten Wasser ist mehr Sauerstoff gelöst","im warmen Wasser ist der Sauerstoffgehalt am höchsten","die Wassertemperatur hat keinen Einfluss auf den Sauerstoffgehalt"],r:0,e:"Kaltes Wasser kann deutlich mehr Sauerstoff lösen als warmes Wasser."},
  {g:3,f:"Warum sind nährstoffhaltige Einleitungen für ein Gewässer schädlich?",a:["beim Abbau wird dem Gewässer Sauerstoff entzogen","das Wasser wird trübe, so dass man die Fische nicht mehr erkennen kann","das Wasser erwärmt sich zu sehr"],r:0,e:"Beim bakteriellen Abbau der eingeleiteten Nährstoffe wird dem Wasser Sauerstoff entzogen, was zu Sauerstoffmangel führen kann."},
  {g:3,f:"Welchen Einfluss haben Nährstoffeinträge auf das Wasser?",a:["das Wasser wird mit Sauerstoff angereichert","das Wasser wird klarer","fördert übermäßigen Pflanzenwuchs mit allen Folgen"],r:2,e:"Zu viele Nährstoffe (Eutrophierung) fördern übermäßiges Pflanzen- und Algenwachstum mit negativen Folgen für den Sauerstoffhaushalt."},
  {g:3,f:"Welche pH-Werte sind für Fische gut geeignet?",a:["6,5 - 8,5","3,0 - 5,0","9,5 - 12,0"],r:0,e:"Der für Fische verträgliche pH-Bereich liegt etwa zwischen 6,5 und 8,5 (neutral bis leicht alkalisch)."},
  {g:3,f:"Sinkt der pH-Wert unter 7, ist das Wasser",a:["sauer","alkalisch","neutral geblieben"],r:0,e:"pH-Werte unter 7 kennzeichnen saures Wasser, über 7 alkalisches (basisches) Wasser, genau 7 ist neutral."},
  {g:3,f:"Was zeigt der pH-Wert?",a:["den Reaktionszustand des Wassers (sauer/neutral/alkalisch)","den Eisengehalt des Wassers","den Sauerstoffgehalt des Wassers"],r:0,e:"Der pH-Wert gibt an, ob Wasser sauer, neutral oder alkalisch reagiert."},
  {g:3,f:"Welche chemische Wasseruntersuchung kann mit geringem Aufwand durchgeführt werden?",a:["der Kaliumpermanganatverbrauch","die Bestimmung des Phosphatgehaltes","die pH-Wert-Bestimmung"],r:2,e:"Die pH-Wert-Bestimmung lässt sich einfach und mit geringem Aufwand durchführen, z. B. mit Teststreifen."},
  {g:3,f:"Wie wird der Zustand des Wassers bezeichnet, wenn der pH-Wert über 7 steigt?",a:["sauer","alkalisch","neutral"],r:1,e:"Ein pH-Wert über 7 wird als alkalisch (basisch) bezeichnet."},
  {g:3,f:"Worauf deutet Notatmung bei Fischen hin?",a:["Laichaktivität","Sauerstoffmangel","Nahrungsaufnahme"],r:1,e:"Fische schnappen bei Sauerstoffmangel an der Wasseroberfläche nach Luft (Notatmung)."},
  {g:3,f:"Wie weit reicht die Uferzone in stehenden Gewässern vom Ufer aus?",a:["bis zu einer Wassertiefe von 5 Meter","soweit Licht bis auf den Boden dringt","immer 10 Meter vom Ufer"],r:1,e:"Die Uferzone reicht so weit, wie noch genügend Licht für Pflanzenwachstum bis auf den Grund dringt."},
  {g:3,f:"Welche Zone des Sees ist im Hinblick auf den Fischzuwachs die ertragreichste?",a:["Freiwasserzone","Uferzone","Lichtlose Tiefe"],r:1,e:"Die Uferzone bietet Nahrung, Deckung und Laichplätze und ist daher am ertragreichsten."},
  {g:3,f:"In welcher Reihenfolge kommen Wasserpflanzen in stehenden Gewässern vom Ufer zur Seemitte hin vor?",a:["Schwimmblattpflanzen, unterseeische Wiesen, Laichkräuter und Gelegegürtel","Gelegegürtel, Schwimmblattpflanzen, Laichkräuter und unterseeische Wiesen","unterseeische Wiesen, Gelegegürtel, Laichkräuter und Schwimmblattpflanzen"],r:1,e:"Vom Ufer zur Seemitte folgen: Gelegegürtel (Röhricht), Schwimmblattpflanzen, Laichkräuter, dann die unterseeischen Wiesen."},
  {g:3,f:"Wodurch wird die Freiwasserzone gekennzeichnet?",a:["seitlich durch das Ufer, nach oben durch die Luft, nach unten durch den Grund","seitlich durch das Gelege, nach oben durch die Sprungschicht, nach unten durch die Schlammschicht","seitlich durch die Uferzone, nach oben durch den Wasserspiegel, nach unten durch die Bodenzone"],r:2,e:"Die Freiwasserzone (Pelagial) wird seitlich von der Uferzone, nach oben vom Wasserspiegel und nach unten von der Bodenzone begrenzt."},
  {g:3,f:"Warum kann es besonders in stehenden Gewässern unter dem Eis zum Verenden der Fische kommen?",a:["die Wassertemperaturen sind zu niedrig, so dass Fische erfrieren","aus der Luft kann kein Stickstoff ins Wasser gelangen, Fische ersticken","Fische ersticken, weil das Wasser keinen Sauerstoff aus der Luft aufnehmen kann"],r:2,e:"Unter einer geschlossenen Eisdecke kann kein Sauerstoff aus der Luft ins Wasser gelangen – bei Sauerstoffmangel ersticken die Fische."},
  {g:3,f:"Was wird unter Frühjahrs- und Herbstvollzirkulation in stehenden Gewässern verstanden?",a:["die Frühjahrs- und Herbstabfischung von Teichen","die vollständige temperaturbedingte Umwälzung der Wassermasse in allen Wassertiefen","die teilweise Umwälzung der Wassermasse in den verschiedenen Tiefen"],r:1,e:"Im Frühjahr und Herbst gleicht sich die Wassertemperatur an, wodurch sich die gesamte Wassermasse durchmischt (Vollzirkulation)."},
  {g:3,f:"Stehende Gewässer sind besonders ertragreich, wenn",a:["das Tageslicht überall bis auf den Grund dringt und die Wassermasse mehrmals pro Jahr umgeschichtet wird","das Wasser einen Zu- und Abfluss hat","eine dauerhafte chemische Schichtung vorhanden ist"],r:0,e:"Flache, gut durchlichtete und regelmäßig durchmischte Gewässer sind besonders nährstoff- und ertragreich."},
  {g:3,f:"Was ist notwendig, damit Pflanzen Sauerstoff produzieren können?",a:["das Wasser muss stark alkalisch sein","das Licht","die Wassertemperatur muss über 18°C liegen"],r:1,e:"Ohne Licht findet keine Fotosynthese statt – Pflanzen produzieren dann keinen Sauerstoff."},
  {g:3,f:"Geben Überwasserpflanzen Sauerstoff an das Wasser ab?",a:["nein, überhaupt nicht","ja, sehr gut","ja, nur am Tag bei Sonnenlicht"],r:0,e:"Überwasserpflanzen (z. B. Schilf) geben ihren Sauerstoff über die Blätter an die Luft ab, nicht an das Wasser."},
  {g:3,f:"Warum sind Algen und Unterwasserpflanzen für ein Gewässer so wichtig?",a:["sie bilden einen wichtigen Teil der Nahrungskette","hier laichen alle Salmoniden ab","sie bilden das Ende der Nahrungskette in einem Gewässer"],r:0,e:"Algen und Unterwasserpflanzen stehen am Anfang der Nahrungskette und versorgen viele Wasserlebewesen mit Nahrung und Sauerstoff."},
  {g:3,f:"Welche Wasserpflanzen reichern das Wasser in stehenden Gewässern am besten mit Sauerstoff an?",a:["Laichkräuter und Pflanzen der unterseeischen Wiesen","See- und Teichrosen","Schilf und Kalmus"],r:0,e:"Submerse Pflanzen wie Laichkräuter und die unterseeischen Wiesen reichern das Wasser direkt mit Sauerstoff an, da sie vollständig unter Wasser stehen."},
  {g:3,f:"Welche Wasserpflanzen bezeichnen wir als Unterwasserpflanzen?",a:["Schilf, Binsen","Seerosen, Teichrosen","Wasserpest, Hornblatt"],r:2,e:"Wasserpest und Hornblatt wachsen vollständig unter Wasser (submers) und zählen zu den Unterwasserpflanzen."},
  {g:3,f:"Welche Wasserpflanzen sind fischereilich besonders wertvoll?",a:["Wasserlinsen, Seerosen und Froschbiss","Tannenwedel, Segge und Igelkolben","Pflanzen der Laichkrautzone und der unterseeischen Wiesen"],r:2,e:"Die Laichkrautzone und die unterseeischen Wiesen bieten Laichplätze, Nahrung und Sauerstoff und sind fischereilich besonders wertvoll."},
  {g:3,f:"Was versteht man unter Wasserpest?",a:["Eine Unterwasserpflanze","Verseuchtes Wasser","Eine Fischkrankheit"],r:0,e:"Die Wasserpest (Elodea) ist eine schnellwüchsige Unterwasserpflanze, kein Krankheitsbegriff."},
  {g:3,f:"Was wird unter dem Begriff Fotosynthese verstanden?",a:["die Unterwasserfotografie von Pflanzen und Fischen","die wissenschaftliche Erforschung von neuen Fischarten","Pflanzen bauen unter Lichteinwirkung organische Stoffe für ihr Wachstum auf"],r:2,e:"Fotosynthese ist der Prozess, bei dem Pflanzen mithilfe von Licht organische Stoffe aufbauen und dabei Sauerstoff freisetzen."},
  {g:3,f:"Woraus setzt sich pflanzliches Plankton hauptsächlich zusammen?",a:["Aus einzelligen Grün- und Kieselalgen","Aus abgerissenen Stängeln der Wasserpest","Aus Fadenalgen und Abwasserpilzen"],r:0,e:"Pflanzliches Plankton (Phytoplankton) besteht hauptsächlich aus einzelligen Grün- und Kieselalgen."},
  {g:3,f:"Was versteht der Fischer unter Wasserblüte?",a:["übermäßige Anreicherung des Wassers mit Blütenstaub","übermäßige Entwicklung verschiedener Algenarten","die Blüten der Schwimmblattpflanzen"],r:1,e:"Als Wasserblüte bezeichnet man die massenhafte Vermehrung von Algen, die das Wasser grün oder trüb färbt."},
  {g:3,f:"Was wird als pflanzlicher Aufwuchs bezeichnet?",a:["Weidewuchs am Ufer","Algen an Gegenständen und Pflanzen im Wasser","Wasserpflanzenkulturen"],r:1,e:"Aufwuchs bezeichnet den Algenbelag, der sich auf Steinen, Pflanzen und anderen Gegenständen im Wasser bildet."},
  {g:3,f:"Welche Fischnährtiere sind für die Ernährung der Fischbrut besonders wichtig?",a:["Muscheln und Schnecken","tierisches Plankton","Anflugnahrung"],r:1,e:"Junge Fischbrut ernährt sich vor allem von kleinem tierischem Plankton (Zooplankton)."},
  {g:3,f:"Welche Faktoren sind für die Gewässergüte mit ausschlaggebend?",a:["die fischereiliche Nutzung","der Verschmutzungsgrad und das Vorkommen bestimmter Lebewesen","die Strömungsgeschwindigkeit"],r:1,e:"Die Gewässergüte wird anhand des Verschmutzungsgrades und der vorkommenden Zeigerorganismen (Kleinlebewesen) bestimmt."},
  {g:3,f:"Welche Fischnährtiere leben vor allem am Gewässergrund der Brassen- und Brackwasserregion?",a:["Hüpferlinge","Schlammröhrenwürmer","Wasserflöhe"],r:1,e:"Im schlammigen Grund der Brassen- und Brackwasserregion leben vor allem Schlammröhrenwürmer."},
  {g:3,f:"Woran sind Insekten und zumeist auch deren Larven erkennbar?",a:["sie haben 3 Paar Beine","sie haben mindestens 5 Paar Beine","sie haben stets 2 Paar Beine"],r:0,e:"Insekten haben grundsätzlich 3 Beinpaare (6 Beine) – ein Hauptmerkmal zur Bestimmung."},
  {g:3,f:"Welche Käfer können bei Massenauftreten fischereischädlich sein?",a:["Marienkäfer","Gelbrandkäfer","Maikäfer"],r:1,e:"Gelbrandkäfer und ihre Larven sind räuberisch und können bei Massenauftreten Fischbrut erbeuten."},
  {g:3,f:"Im Stoffkreislauf eines Gewässers finden wir hauptsächlich folgende Lebewesen",a:["Pflanzen, Bakterien, Tiere","Äschen, Karpfen, Hecht","Rohrkolben, Schilf, Wasserpest"],r:0,e:"Der Stoffkreislauf eines Gewässers wird von Pflanzen (Produzenten), Tieren (Konsumenten) und Bakterien (Destruenten) getragen."},
  {g:3,f:"Wie nennt man die Qualitätsstufen der Fließgewässer, die durch darin vorkommende Kleinlebewesen und Mikroorganismen bestimmt werden können?",a:["Gewässergüteklassen","Fischereibezirke","Fließwasserregionen"],r:0,e:"Die Gewässergüteklassen (I bis IV) beschreiben den Verschmutzungsgrad anhand von Zeigerorganismen."},
  {g:3,f:"Bei welchen Insekten gibt es Arten, deren Larven sich ein Gehäuse bauen?",a:["Libellen","Steinfliegen","Köcherfliegen"],r:2,e:"Köcherfliegenlarven bauen sich charakteristische Gehäuse (Köcher) aus Sandkörnern, Pflanzenteilen oder Schneckenschalen."},
  {g:3,f:"Was ist ein Fischegel?",a:["ein Darmschmarotzer","ein blutsaugender Außenparasit","ein auf den Kiemen schmarotzender Kleinkrebs"],r:1,e:"Der Fischegel ist ein blutsaugender äußerer Parasit, der sich an der Haut von Fischen festsetzt."},
  {g:3,f:"Welcher Parasit schmarotzt auf der Haut von Fischen?",a:["die Karpfenlaus","der Riemenwurm","der Schwimmblasenwurm"],r:0,e:"Die Karpfenlaus (Argulus) ist ein Hautparasit, der sich an der Fischhaut festsaugt."},
  {g:3,f:"Welche Tiere sind Außenparasiten?",a:["Eintagsfliege, Schlammröhrenwürmer, Zuckmückenlarven","Viren und Bandwürmer","Fischegel, Karpfenlaus, Kiemenkrebs"],r:2,e:"Fischegel, Karpfenlaus und Kiemenkrebs leben außen am Fisch und zählen zu den Außenparasiten."},
  {g:3,f:"In welcher Reihenfolge unterscheiden wir die fischereilichen Fließwasserregionen von der Quelle bis zur Mündung ins Meer?",a:["Forellen-, Äschen-, Brassen-, Barben- und Brackwasserregion","Forellen-, Äschen-, Barben-, Brassen- und Brackwasserregion","Forellen-, Barben-, Äschen-, Brassen- und Brackwasserregion"],r:1,e:"Von der Quelle zur Mündung: Forellenregion, Äschenregion, Barbenregion, Brassenregion, Brackwasserregion."},
  {g:3,f:"Bilden sich beim Fließgewässer von der Quelle bis zur Mündung unterschiedliche Lebensräume (Biotope) für Fische?",a:["es gibt verschiedene Gewässerregionen, die von der Strömungsgeschwindigkeit, Temperatur, Wasser- und Bodenbeschaffenheit abhängig sind","ja, es kommt auf die Breite des Gewässers an","nein, die Lebensräume für Fische sind überall gleich"],r:0,e:"Von der Quelle bis zur Mündung entstehen unterschiedliche Gewässerregionen, geprägt von Strömung, Temperatur sowie Wasser- und Bodenbeschaffenheit."},
  {g:3,f:"In welcher Fließwasserregion ist der Jahrestemperaturunterschied am geringsten?",a:["in der Brackwasserregion","in der Barbenregion","in der Forellenregion"],r:2,e:"Die Forellenregion liegt quellnah – dort schwanken die Wassertemperaturen übers Jahr am wenigsten."},
  {g:3,f:"Welche Fließwasserregion ist am sauerstoffreichsten?",a:["Brackwasserregion","Barbenregion","Forellenregion"],r:2,e:"Die Forellenregion hat kaltes, schnell fließendes und stark verwirbeltes Wasser – dort ist der Sauerstoffgehalt am höchsten."},
  {g:3,f:"Welche Fließwasserregion liegt der Quelle am nächsten?",a:["Barbenregion","Brassenregion","Forellenregion"],r:2,e:"Die Forellenregion beginnt direkt an der Quelle."},
  {g:3,f:"In welcher Flussregion leben die meisten Fischarten?",a:["Äschenregion","Brassenregion","Forellenregion"],r:1,e:"In der Brassenregion (unterster, langsamer fließender Abschnitt) leben die meisten unterschiedlichen Fischarten."},
  {g:3,f:"Welches Wasser ist für Bachforellen vorteilhaft?",a:["strömendes, warmes und leicht getrübtes Wasser","fließendes, im Sommer kaltes und sauerstoffreiches Wasser","reißendes, weiches und leicht trübes Wasser"],r:1,e:"Bachforellen brauchen kühles, sauerstoffreiches, fließendes Wasser, auch im Sommer."},
  {g:3,f:"In welcher Region eines Flusses ist der Sauerstoffgehalt am geringsten?",a:["Äschenregion","Forellenregion","Brackwasserregion"],r:2,e:"In der Brackwasserregion (Mündungsbereich) ist das Wasser wärmer und langsamer fließend – dort ist der Sauerstoffgehalt am geringsten."},
  {g:3,f:"Welche Eigenschaften kennzeichnen die Barbenregion der Fließgewässer?",a:["kiesiger Untergrund, gleichmäßige Strömung und Pflanzenwuchs","schlammiger Untergrund, langsam fließendes Wasser","felsiger Untergrund, rasch fließendes Wasser"],r:0,e:"Die Barbenregion hat kiesigen Untergrund, gleichmäßige Strömung und Pflanzenbewuchs."},
  {g:3,f:"Welche Eigenschaften kennzeichnen die Brassenregion?",a:["schlammiger Untergrund, langsam fließendes Wasser","kiesiger Untergrund, gleichmäßige Strömung und Pflanzenwuchs","felsiger Untergrund, gleichmäßige Strömung und Pflanzenwuchs"],r:0,e:"Die Brassenregion hat schlammigen Untergrund und langsam fließendes Wasser."},
  {g:3,f:"Was ist ein Altarm?",a:["Ein Gewässer, dessen Wasser gealtert ist","Ein Gewässer mit überaltertem Fischbestand","Ein früherer Teil eines Flusses"],r:2,e:"Ein Altarm ist ein ehemaliger Flussabschnitt, der vom Hauptfluss abgetrennt wurde, z. B. durch Laufverlagerung."},
  {g:3,f:"Wonach sollen sich Art und Menge des Fischbesatzes vorrangig richten?",a:["nach dem Preis der Fische","nach den Mehrheitsbeschlüssen der Gewässerpächter","nach der fischereibiologischen Eignung und der vorhandenen Nahrung"],r:2,e:"Fischbesatz sollte sich vorrangig nach der fischereibiologischen Eignung des Gewässers und dem vorhandenen Nahrungsangebot richten, nicht nach Preis oder Mehrheitsbeschlüssen."},

  /* ============ 3 · GEWÄSSERKUNDE (Fragen 54–60) ============ */
  {g:3,f:"Sind beim Fischbesatz auch die Fischarten zu berücksichtigen, die fischereilich nicht genutzt werden?",a:["ja, nur wenn sie im Gewässer noch nicht vorkommen","nein, denn sie sind Nahrungskonkurrenten der Nutzfische","ja, weil sie wichtige Glieder der Lebensgemeinschaft sind und zum Artenschutz beitragen"],r:2,e:"Auch nicht genutzte Arten gehören zur Lebensgemeinschaft und sind für den Artenschutz wichtig."},
  {g:3,f:"Was kann aus einer chemischen Wasseruntersuchung in Verbindung mit einer biologischen Gewässeruntersuchung ersehen werden?",a:["Angelmethode für das Gewässer","Eignung des Gewässers für bestimmte Fischarten","im Gewässer kann Netzfischerei betrieben werden"],r:1,e:"Chemische und biologische Untersuchung zusammen zeigen, für welche Fischarten das Gewässer geeignet ist."},
  {g:3,f:"Was sollte eine Fangmeldung enthalten?",a:["Fischart, Anzahl und Gewicht der Fische sowie den Gewässernamen","Färbung der Fische","Fanggeräte und Verwendung des Fanges"],r:0,e:"Eine Fangmeldung enthält Fischart, Anzahl, Gewicht und den Gewässernamen – wichtig für die Hege."},
  {g:3,f:"Für welche Fischarten sollen besonders günstige Laichmöglichkeiten geschaffen werden?",a:["für alle Fische, die ins Gewässer gehören und sich ungenügend vermehren","nur für die teuren Besatzfische","nur für Fische mit hohem Marktwert"],r:0,e:"Laichhilfen sollen allen standortgerechten Arten helfen, die sich zu wenig vermehren."},
  {g:3,f:"Wie können Laichmöglichkeiten in einem Gewässer gefördert werden?",a:["durch Uferbegradigungen an den Gewässern","durch Anlage von Laichwiesen, durch Einbringen von Kies und Steinen","durch Entfernen von Wasserpflanzen und Laichkräutern"],r:1,e:"Laichwiesen sowie eingebrachter Kies und Steine schaffen neue Laichplätze."},
  {g:3,f:"Wie verhalte ich mich als Angler, wenn ich einen vermeintlich kranken Fisch gefangen habe?",a:["ich setze ihn umgehend zurück","ich benachrichtige den Vereinsvorstand, der Weiteres veranlasst","ich töte und zerschneide den Fisch und vergrabe ihn am Ufer"],r:1,e:"Bei Krankheitsverdacht den Vereinsvorstand/Gewässerwart informieren, der das Weitere veranlasst."},
  {g:3,f:"Was sind Fischtreppen oder Fischpässe?",a:["bevorzugte Routen im Zuge von Fischwanderungen","spezielle Bauten in Fließgewässern, die den Fischen das Überwinden von Hindernissen (Schleusen, Wehre, Staue) ermöglichen","Zugänge zu Angelplätzen"],r:1,e:"Fischtreppen/-pässe ermöglichen Fischen das Überwinden von Wehren, Schleusen und Staustufen."},

  /* ============ 4 · FISCHFANG UND GERÄTEKUNDE (Fragen 1–60) ============ */
  {g:4,f:"Worauf sollte bei der Wahl einer Angelschnur besonders geachtet werden?",a:["auf die Lebensdauer","auf den Durchmesser und die Tragkraft","auf die Färbung der Schnur"],r:1,e:"Entscheidend sind Durchmesser und Tragkraft – passend zu Fisch und Gewässer."},
  {g:4,f:"Wie heißt die weltweit verbreitete Standardbezeichnung für die Gewichtsklassen der Fliegenschnüre?",a:["AFTMA","OPEC","IGFA"],r:0,e:"Die AFTMA-Klasse gibt das Gewicht der Fliegenschnur an und muss zur Rute passen."},
  {g:4,f:"Welche Schnur ist beim Friedfischfang für das Vorfach, im Hinblick auf die Hauptschnur, zu wählen?",a:["spielt keine Rolle","ist das Vorfach sehr lang, soll der Durchmesser größer sein","für das Vorfach sollte eine geringere Schnurstärke gewählt werden"],r:2,e:"Ein dünneres Vorfach reißt im Zweifel zuerst – so verliert man nur Haken und Vorfach, nicht die Hauptschnur."},
  {g:4,f:"Was ist mit angerauter Angelschnur zu machen?",a:["abschneiden und sachgerecht entsorgen","abschneiden und kleingeschnitten ins Gebüsch werfen","Schnur mit Spezialspray glätten"],r:0,e:"Beschädigte Schnur abschneiden und im Müll entsorgen – nie im Gewässer/Ufer liegen lassen (Gefahr für Tiere)."},
  {g:4,f:"Welche Merkmale zeichnen moderne geflochtene Angelschnüre aus?",a:["sie besitzen bei gleichem Durchmesser eine geringere Tragkraft als monofile Schnüre","sie haben eine erheblich geringere Dehnung und eine höhere Tragkraft als monofile Schnüre","bei gleichem Durchmesser sind sie im Wasser weniger sichtbar"],r:1,e:"Geflochtene Schnüre dehnen kaum und tragen bei gleichem Durchmesser mehr als monofile."},
  {g:4,f:"Wovon hängt in erster Linie die zu verwendende Schnurstärke ab?",a:["von der Gewässerart und Fangerwartung","von der Gewässertiefe","von der Größe der Schnurführungsringe"],r:0,e:"Die Schnurstärke richtet sich nach Gewässerart und erwarteter Fischgröße."},
  {g:4,f:"An einem Angelgerät wird welcher Teil als Vorfach bezeichnet?",a:["der Schnurteil, der an der Rutenspitze befestigt wird","der Schnurteil zwischen Hauptschnur und Haken","der Schnurteil, der von der Hauptschnur auf die Rolle gewickelt wird"],r:1,e:"Das Vorfach ist das Schnurstück zwischen Hauptschnur und Haken."},
  {g:4,f:"Welcher Knoten hat sich beim Verbinden monofiler Schnüre besonders bewährt?",a:["möglichst unkompliziert, z. B. der Weberknoten","Blut- oder Tönnchenknoten","die Art des Knotens hat keinen Einfluss auf die Festigkeit"],r:1,e:"Zum Verbinden monofiler Schnüre eignet sich der Blut-/Tönnchenknoten."},
  {g:4,f:"Warum sind schadhafte Schnurführungsringe an der Angelrute nicht fischwaidgerecht?",a:["sie beschädigen die Schnur, sodass sie reißen kann","sie behindern den Schnurablauf beim Wurf entscheidend","sie beschädigen die Schnur, die dann von den Fischen leichter gesehen wird"],r:0,e:"Beschädigte Ringe rauen die Schnur an – sie kann im Drill reißen und der Fisch entkommt verletzt."},
  {g:4,f:"Was gefährdet eine monofile Angelschnur am meisten?",a:["schadhafte Ringe, scharfe Kanten an der Rolle, ultraviolettes Licht","langes Liegenlassen im Wasser","starke Kälte"],r:0,e:"Scharfe Kanten und UV-Licht schwächen monofile Schnur am stärksten – daher regelmäßig erneuern."},
  {g:4,f:"Wie soll die Angelschnur beim Anhieb geführt werden?",a:["gespannt, Fühlung mit dem Fisch","spielt keine Rolle","locker, leicht durchhängend"],r:0,e:"Nur bei gespannter Schnur (Fühlung zum Fisch) sitzt der Anhieb sicher."},
  {g:4,f:"Welcher Teil der Angelschnur nutzt sich am stärksten ab?",a:["die hinteren, an der Rolle angebundenen Meter","die gesamte Schnur wird gleichmäßig abgenutzt","die ersten Meter hinter dem Haken"],r:2,e:"Die letzten Meter vor dem Haken sind am stärksten beansprucht – regelmäßig kürzen/neu knüpfen."},
  {g:4,f:"Welches ist beim Fliegenfischen das zu werfende Gewicht?",a:["Bleibeschwerung","Fliege","Fliegenschnur"],r:2,e:"Beim Fliegenfischen wird das Gewicht der Fliegenschnur geworfen – die Fliege ist nahezu gewichtslos."},
  {g:4,f:"Wie beeinflussen Knoten die Tragfähigkeit der Schnur?",a:["die Tragfähigkeit ist am Knoten größer","die Tragfähigkeit der geknoteten Schnur ändert sich nicht","die Tragfähigkeit ist am Knoten geringer"],r:2,e:"Jeder Knoten schwächt die Schnur – an der Knotenstelle ist die Tragkraft geringer."},
  {g:4,f:"Warum soll beim Hechtfang ein Stahlvorfach verwendet werden?",a:["der Köder könnte sich in der Angelschnur verfangen","der schwere Kunstköder könnte besser geführt werden","die Angelschnur könnte beim Drill an den Zähnen des Hechtes scheuern und reißen"],r:2,e:"Die scharfen Hechtzähne würden eine normale Schnur durchtrennen – ein Stahlvorfach verhindert das."},
  {g:4,f:"Wonach richtet sich weitgehend die Länge der Angelrute?",a:["nach der Größe des Gewässers","nach der Größe des Fisches","nach der Uferbeschaffenheit"],r:2,e:"Die Rutenlänge richtet sich vor allem nach der Uferbeschaffenheit (Bewuchs, Platz zum Werfen)."},
  {g:4,f:"Welche Vorteile haben Kohlefaserruten?",a:["sie sind besonders elastisch","sie sind trotz großer Steifheit besonders leicht und daher gut zu handhaben","sie besitzen eine besonders hohe Bruchfestigkeit und leiten keinen Strom"],r:1,e:"Kohlefaserruten sind sehr leicht und steif – aber sie leiten Strom (Vorsicht bei Gewitter!)."},
  {g:4,f:"Was wird als Rutenaktion bezeichnet?",a:["die Art der Verwendung der Rute","die Stärke der Rute","die Art der Durchbiegung der Rute bei Belastung"],r:2,e:"Die Aktion beschreibt, wie und wo sich die Rute unter Last durchbiegt (z. B. Spitzen- oder Vollaktion)."},
  {g:4,f:"Weshalb wird bei den meisten Angelruten das Wurfgewicht angegeben?",a:["so weiß man, bis zu welchem Gewicht man die Fische herausheben kann","die Tragkraft der Schnur lässt sich so auswählen","die Rute kann so beim Wurf nicht überlastet werden"],r:2,e:"Das angegebene Wurfgewicht schützt die Rute vor Überlastung beim Wurf."},
  {g:4,f:"An welcher Stelle der Fliegenrute befindet sich die Fliegenrolle?",a:["vor der Wurfhand, am oberen Ende des Rutengriffes","hinter der Wurfhand, am hinteren Ende der Rute","unter der Wurfhand, am oberen Griffteil"],r:1,e:"Bei der Fliegenrute sitzt die Rolle hinter der Wurfhand am unteren Rutenende."},
  {g:4,f:"Was ist eine Teleskoprute?",a:["eine zusammenschiebbare Angelrute","eine leichte Hohlglasfiberrute, die zusammengesteckt wird","eine besonders lange, einteilige Stipprute"],r:0,e:"Eine Teleskoprute lässt sich zum Transport zusammenschieben."},
  {g:4,f:"Wie sollte die Angelrute beschaffen sein, die der Angler beim Brandungsfischen benutzt?",a:["es sollten nur Kopfruten benutzt werden","die Rute sollte dem Brandungsbereich entsprechend stark und lang sein","es sollten kurze, steife Ruten benutzt werden"],r:1,e:"Brandungsruten müssen lang und kräftig sein, um schwere Bleie weit über die Brandung zu werfen."},
  {g:4,f:"Worauf ist bei der Benutzung von Kohlefaserruten zu achten?",a:["Kohlefaserruten leiten Strom sehr gut, darum ist Vorsicht bei Gewitter und in der Nähe von Stromleitungen geboten","Kohlefaserruten sind hoch belastbar, deshalb kann die Schnur leicht reißen","Kohlefaserruten sind nicht elektrisch leitend"],r:0,e:"Kohlefaser leitet Strom – bei Gewitter oder unter Stromleitungen besteht Lebensgefahr."},
  {g:4,f:"Für welche Fangmethoden eignet sich die Stationärrolle besonders gut?",a:["sie eignet sich gleich gut für alle Fangmethoden","für das Fliegenfischen","für die leichte und mittlere Spinnfischerei und für das Grundangeln"],r:2,e:"Die Stationärrolle ist der Allrounder für leichtes/mittleres Spinnfischen und Grundangeln."},
  {g:4,f:"Wie stark wird normalerweise die Schnurbremse bei der Stationärrolle für den Drill eingestellt?",a:["die Reißfestigkeit der Schnur darf nicht überschritten werden","etwas stärker als die Reißfestigkeit der Schnur","so stark, dass der Fisch keine Schnur abziehen kann"],r:0,e:"Die Bremse darf nie stärker als die Reißfestigkeit der Schnur eingestellt sein, sonst reißt sie im Drill."},
  {g:4,f:"Welche Einrichtung einer Angelrolle verhindert einen Schnurriss beim Drill eines Fisches?",a:["Schnurbremse","Übersetzung","Rücklaufsperre"],r:0,e:"Die Schnurbremse gibt bei starkem Zug Schnur frei und verhindert so den Schnurriss."},
  {g:4,f:"Welche Aufgabe hat die einstellbare Schnurbremse bei den Angelrollen?",a:["die Bremse nach der Größe des zu erwartenden Fisches einzustellen","die Bremswirkung an die Reißfestigkeit der Schnur anzupassen","sie so einzustellen, dass der Fisch keine Schnur beim Drill abziehen kann"],r:1,e:"Die Bremse wird an die Reißfestigkeit der Schnur angepasst."},
  {g:4,f:"Bei welchem Rollentyp dreht sich beim Auswerfen die Schnurspule nicht?",a:["Multirolle","Stationärrolle","Grundrolle"],r:1,e:"Bei der Stationärrolle steht die Spule fest; die Schnur läuft beim Wurf über den Spulenrand ab."},
  {g:4,f:"Welche Hilfsgeräte muss der Angler beim Fischfang mit sich führen?",a:["akustische Bissanzeiger","Unterfangkescher, Maßband, Schlagholz, scharfes Messer und Hakenlöser","Ersatzruten und Sitzgelegenheit"],r:1,e:"Zur waidgerechten Versorgung gehören Kescher, Maßband, Betäubungsgerät, Messer und Hakenlöser."},
  {g:4,f:"Für welche Angelmethode sind Multi- und Stationärrolle nicht geeignet?",a:["für das Grundfischen","für das Spinnfischen","für das Fliegenfischen"],r:2,e:"Fürs Fliegenfischen braucht man eine Fliegenrolle – Multi- und Stationärrolle sind ungeeignet."},
  {g:4,f:"Welcher Rollentyp ist heute bei uns am gebräuchlichsten?",a:["Multirolle","einfache Rolle","Stationärrolle"],r:2,e:"Die Stationärrolle ist heute der am weitesten verbreitete Rollentyp."},
  {g:4,f:"Was ist eine Multirolle?",a:["eine übersetzte Rolle mit nicht rotierender Schnurspule","eine übersetzte Rolle mit sich drehender Schnurspule","eine einfache Rolle ohne Übersetzung"],r:1,e:"Bei der Multirolle dreht sich die Spule beim Werfen und Einholen mit."},
  {g:4,f:"Bei welchem Rollentyp dreht sich beim Werfen die Schnurspule?",a:["Stationärrolle","Kapselrolle","Multirolle"],r:2,e:"Nur bei der Multirolle dreht sich die Spule beim Werfen mit."},
  {g:4,f:"Bei welcher Angelmethode werden in der Regel Drillinge verwendet?",a:["beim Spinnfischen","beim Fischen auf Friedfische, besonders auf Karpfen","beim Fliegenfischen"],r:0,e:"Beim Spinnfischen (Kunstköder) sind Drillinge üblich; auf Friedfische nutzt man Einzelhaken."},
  {g:4,f:"Was sind „Wurmhaken“?",a:["Haken mit langen Schenkeln","Haken mit Widerhaken am Schenkel","Haken mit Öhr"],r:1,e:"Wurmhaken haben zusätzliche Widerhaken am Schenkel, damit der Wurm besser hält."},
  {g:4,f:"Was bedeutet die Hakenskala von 1–18?",a:["Hakengröße 15 ist größer als Hakengröße 8","Hakengröße 3 ist kleiner als Hakengröße 13","Hakengröße 1 ist größer als Hakengröße 6"],r:2,e:"Je höher die Zahl, desto kleiner der Haken – also ist Größe 1 größer als Größe 6."},
  {g:4,f:"Welche Angelhaken sollen beim Angeln auf Cypriniden benutzt werden?",a:["Drillingshaken","Zwillingshaken","einfache Haken"],r:2,e:"Auf Friedfische (Cypriniden) verwendet man einfache Haken – schonender und tierschutzgerecht."},
  {g:4,f:"Sollte beim Angeln auf Cypriniden ein Zwillings- oder Drillingshaken benutzt werden?",a:["nur bei bestimmten Fischen","niemals","nur bei Kartoffelköder"],r:1,e:"Auf Friedfische niemals Mehrfachhaken – aus Tierschutzgründen nur Einzelhaken."},
  {g:4,f:"Welche Angelmethode ist für Forellen die schonendste?",a:["Angeln mit Wurm","Angeln mit kleinen Spinnern und Blinkern","Angeln mit der Fliege"],r:2,e:"Beim Fliegenfischen wird der Fisch fast immer vorn im Maul gehakt – die schonendste Methode."},
  {g:4,f:"Was bezeichnet man als Stippfischen?",a:["das Angeln auf kleine Friedfische","das Angeln auf große Karpfen","das Angeln auf kleine Hechte"],r:0,e:"Stippfischen ist das Angeln auf kleine Friedfische mit einer Rute ohne Rolle."},
  {g:4,f:"Welches besondere Zubehör benötigt man zum Feederfischen?",a:["Futterkorb, Wechselspitzen, Rutenablage","Fliegenschnur, Fliegenrolle, Streamer","Bissanzeiger, Sitzkiepe, Kopfrute"],r:0,e:"Zum Feedern gehören Futterkorb, feinfühlige Wechselspitzen und eine Rutenablage."},
  {g:4,f:"Was verstehen wir unter Flugangeln oder Fliegenfischen?",a:["eine besondere Angelmethode mit der Wasserkugel","eine besondere Angelmethode unter Verwendung von künstlichen Fliegen und besonderer Schnur","eine besondere Angelmethode unter Verwendung von künstlichen Spinnern und Wobblern"],r:1,e:"Fliegenfischen nutzt künstliche Fliegen und eine schwere Fliegenschnur als Wurfgewicht."},
  {g:4,f:"Was ist für den Fangerfolg beim Spinnfischen ausschlaggebend?",a:["die Art der Rutenringe","die Führung des Köders im Wasser","die Geschmeidigkeit der Schnur"],r:1,e:"Entscheidend ist die verführerische Köderführung im Wasser."},
  {g:4,f:"Welche Regel gilt bei der Zusammenstellung von Rute, Schnur und Haken?",a:["weiche Rutenspitze, dünne Schnur und kleiner Haken","steife Rutenspitze, dünne Schnur und großer Haken","weiche Rutenspitze, starke Schnur und kleiner Haken"],r:0,e:"Die Bauteile müssen zueinander passen: weiche Spitze, dünne Schnur und kleiner Haken bilden ein stimmiges, feines Gerät."},
  {g:4,f:"Warum ist das Fliegenfischen die schonendste Angelmethode?",a:["der Fisch wird fast ausnahmslos in der vorderen Maulpartie gehakt","der gehakte Fisch kann besonders leicht gedrillt werden","man verwendet nur kleine Angelhaken"],r:0,e:"Beim Fliegenfischen sitzt der Haken fast immer vorn im Maul – der Fisch wird kaum verletzt."},
  {g:4,f:"Was ist beim Landen eines größeren Fisches zu beachten?",a:["Fisch so schnell wie möglich mit der Rute aus dem Wasser heben","nach dem Drill den Fisch mit dem Unterfangkescher landen","Rute weglegen und Schnur mit den Händen ziehen"],r:1,e:"Größere Fische werden schonend mit dem Kescher gelandet, nie über die Rute aus dem Wasser gehoben."},
  {g:4,f:"Was muss vor Angelbeginn am Gerät geprüft werden?",a:["Bissanzeiger auf Funktionstüchtigkeit","Schnurführungsringe auf Risse, Schnur auf Tragfähigkeit und Rolle auf richtige Einstellung der Schnurbremse","ob ein Typenschild an der Rute vorhanden ist"],r:1,e:"Vor dem Angeln Ringe, Schnur und Bremseinstellung prüfen – so vermeidet man Schnurriss und Verlust des Fisches."},
  {g:4,f:"Was ist beim Drill zu beachten?",a:["Schnur in stetiger Spannung halten","Schnur möglichst locker lassen","den Drill möglichst lange ausdehnen"],r:0,e:"Die Schnur muss im Drill stets gespannt bleiben, damit sich der Haken nicht löst."},
  {g:4,f:"Was ist ein Springer?",a:["eine von der Hauptschnur abgehende kurze Seitenschnur mit künstlichem oder natürlichem Köder","ein Salmonide, der beim Drill aus dem Wasser springt","ein Insekt, das sich springend auf dem Wasser bewegt"],r:0,e:"Ein Springer ist ein zusätzlicher Köder an einer kurzen Seitenschnur der Hauptschnur."},
  {g:4,f:"Welcher Rutenring wird am stärksten belastet?",a:["Leit- oder Führungsring","alle Ringe werden gleich stark belastet","Spitzen- oder Endring"],r:2,e:"Der Spitzenring wird beim Wurf und im Drill am stärksten belastet."},
  {g:4,f:"Was ist ein Wobbler?",a:["ein Gummiköder mit Bleikopf","eine ein- oder mehrteilige Fischimitation, die im Wasser taumelnde Bewegungen ausführt","ein im Wasser sich drehender Metallköder"],r:1,e:"Ein Wobbler ist ein Kunstköder in Fischform, der beim Einholen taumelt."},
  {g:4,f:"Wodurch zeichnet sich ein Spinner aus?",a:["das Spinnerblatt dreht sich um die Achse","er ist deutlich größer als ein Pilker","es handelt sich um eine Fischnachbildung"],r:0,e:"Beim Spinner rotiert das Blatt um die Achse und erzeugt Druckwellen und Lichtreflexe."},
  {g:4,f:"Was versteht man unter einem Twister?",a:["die beim Fliegenfischen noch nicht gestreckte Schnur","ein Angelköder aus weichem Kunststoff","eine Fliegenmade, die sich schon verpuppt hat"],r:1,e:"Ein Twister ist ein Weichplastik-Köder mit verführerisch schlagendem Schwanz."},
  {g:4,f:"Was versteht man unter einem Pilker?",a:["ein Kunstköder für den Fang von Barschen","ein schwerer Metallköder für das Meeresfischen","ein Landegerät, um schwerere Fische zu bergen"],r:1,e:"Ein Pilker ist ein schwerer Metallköder für das Meeresangeln (z. B. auf Dorsch/Köhler)."},
  {g:4,f:"Welcher Spinnköder ist gewöhnlich mit einer Tauchschaufel versehen?",a:["Blinker","Spinner","Wobbler"],r:2,e:"Die Tauchschaufel des Wobblers bestimmt Lauftiefe und Taumelbewegung."},
